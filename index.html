<style>

.btn.on{background:radial-gradient(circle at 40% 35%,rgba(255,170,60,.9),rgba(140,40,10,.85));transform:scale(.94)}

  {sky:['#0b1232','#253b70','#768eaa'],cloud:['#18294f','#354c77','#6c87b2'],far:['#233655','#3d5376','#657c9d'],near:['#132b39','#294858','#527178'],stone:['#223037','#454a49','#827d66'],green:['#223e32','#4f6741','#a3a366'],glow:'#ffe3a2'},

function wrapArt(g,x,draw){
  for(const shift of [-LWD,0,LWD]){
    g.save();g.translate(Math.round(x)+shift,0);draw();g.restore();
  }
}

function cloudArt(g,y,w,palette,seed){
  const rs=seedR(seed),lobes=[];
  for(let x=5;x<w;x+=7+rs()*10){
    const r=5+rs()*15,cy=y-Math.sin(x/w*PI)*(5+w*.05)+rs()*7;
    lobes.push([x,cy,r]);
  }
  E(g,w*.51,y+3,w*.53,8,palette[0]);
  for(const [x,cy,r] of lobes)E(g,x,cy,r,r*.65,palette[0]);
  for(const [x,cy,r] of lobes)E(g,x-1,cy-r*.20,r*.87,r*.48,palette[1]);
  for(const [x,cy,r] of lobes){
    P(g,[x-r*.85,cy-r*.29,x-r*.45,cy-r*.58,x,cy-r*.67,x+r*.44,cy-r*.54,
      x+r*.20,cy-r*.51,x-r*.32,cy-r*.39],palette[2]);
  }
  for(let i=0;i<18;i++){
    const x=rs()*w,y1=y-rs()*6+6,length=3+rs()*14;
    P(g,[x,y1,x+length*.5,y1-2,x+length,y1-2,x+length*.75,y1,x+length*.36,y1+1],palette[i%2]);
  }
}

function ridgeArt(g,y,height,palette,seed){
  const rs=seedR(seed),points=[];
  for(let x=0;x<LWD;x+=12)points.push([x,Math.round(y-(.3+.7*rs())*height*(.4+.6*Math.abs(Math.sin(x/LWD*TAU*3))))]);
  points.push([LWD,points[0][1]]);
  P(g,[0,180,...points.flat(),LWD,180],palette[0]);
  for(let i=0;i<points.length-1;i++){
    const [x,a]=points[i], [xx,b]=points[i+1];
    if(a<b){
      const reach=16+rs()*height*.6;
      P(g,[x,a,xx,b,xx+10,b+reach,x+5,a+reach*.65],palette[1]);
      L(g,[x,a+1,x+5,a+4,xx,b+1],palette[2],.8);
      L(g,[x+4,a+6,x+7,a+14,x+13,a+20],palette[0],1);
    }
  }
}

function roofArt(g,x,y,w,h,shade,trim){
  const eaves=[x-5,y+h,x+5,y+h-3,x+w*.23,y,x+w*.77,y,x+w-5,y+h-3,x+w+5,y+h];
  P(g,[...eaves,x+w+1,y+h+3,x-1,y+h+3],'#131e2a');
  P(g,eaves,shade);
  for(let i=1;i<12;i++){
    const t=i/12;
    L(g,[x+w*(.23+t*.54),y+1,x+w*t,y+h-1],'#22333f',.65);
  }
  L(g,eaves,trim,.9);
  Rc(g,x-2,y+h+2,w+4,1,'#7e604c');
}

function hallArt(g,y,w,levels,light){
  for(let i=0;i<levels;i++){
    const width=w*(1-i*.31),x=(w-width)/2,floor=y-i*19;
    Rc(g,x+4,floor-14,width-8,14,'#655653');
    Rc(g,x+5,floor-12,width-10,2,'#b38f73');
    Rc(g,x+2,floor-2,width-4,3,'#33434a');
    for(let j=0;j<Math.floor(width/9);j++){
      const post=x+5+j*9;
      Rc(g,post,floor-12,2,10,'#4f3438');
      Rc(g,post+3,floor-9,4,6,'#332e34');
      if(j%3!==1){Rc(g,post+4,floor-8,2,3,light);Rc(g,post+4,floor-9,1,1,'#fff0ba');}
    }
    roofArt(g,x,floor-24,width,10,'#42606a','#7a9295');
  }
}

function bambooArt(g,top,bottom,w,lean,palette,seed){
  const rs=seedR(seed);
  P(g,[0,bottom,lean,top,lean+w,top,w,bottom],palette[0]);
  L(g,[lean+w*.32,top,w*.32,bottom],palette[1],Math.max(.7,w*.25));
  for(let y=bottom-7;y>top;y-=11+rs()*10){
    const x=lean*(bottom-y)/(bottom-top);
    Rc(g,x-1,y,w+2,1,palette[2]);
    if(rs()<.4)continue;
    const dir=rs()>.5?1:-1,tip=x+dir*(7+rs()*10);
    L(g,[x+w/2,y,tip,y-7],palette[1],.85);
    for(let j=0;j<5;j++){
      const bx=x+w/2+(tip-x)*j/5,by=y-j*1.5,dy=j%2?5:-5;
      P(g,[bx,by,bx+dir*6,by+dy,bx+dir*11,by+dy*1.25,bx+dir*6,by],palette[j%2]);
    }
  }
}

function foundryArt(g,y,w,h,palette,light,seed){
  const rs=seedR(seed);
  Rc(g,0,y-h,w,h,palette[0]);Rc(g,3,y-h+2,w-6,3,palette[2]);
  Rc(g,4,y-h-13,w-8,14,palette[1]);
  for(let x=0;x<w;x+=9){
    Rc(g,x,y-h+5,2,h-5,palette[1]);
    for(let yy=y-h+12;yy<y-6;yy+=13){
      Rc(g,x+3,yy,5,6,'#281d25');
      if(rs()<.6){Rc(g,x+4,yy+1,2,4,light);Rc(g,x+4,yy+1,1,2,'#fff1b5');}
    }
  }
}

function gearArt(g,y,r,palette){
  for(let i=0;i<14;i++){
    g.save();g.translate(0,y);g.rotate(i/14*TAU);
    Rc(g,-2,-r-3,4,7,palette[1]);Rc(g,-2,-r-3,1,3,palette[2]);
    if(i%2===0)Rc(g,-1,-r+3,2,r-3,palette[1]);
    g.restore();
  }
  g.strokeStyle=palette[1];g.lineWidth=4;g.beginPath();g.arc(0,y,r-2,0,TAU);g.stroke();
  g.strokeStyle=palette[2];g.lineWidth=1;g.beginPath();g.arc(0,y,r-4,PI,TAU);g.stroke();
  E(g,0,y,5,5,palette[0]);E(g,0,y,2,2,palette[2]);
}

function groundArt(g,p,seed){
  const rs=seedR(seed);
  Rc(g,0,162,LWD,18,p.stone[0]);
  for(let x=0;x<LWD;x+=9){
    const top=160+rs()*5,edge=x+3+rs()*5;
    wrapArt(g,x,()=>{
      const dx=edge-x;
      P(g,[-3,top,dx,top-2,dx+7,top+2,dx+1,180,-7,180],p.stone[1]);
      P(g,[-3,top,dx,top-2,dx+1,top+2,-3,top+9],p.stone[2]);
      L(g,[dx+2,top+2,dx,top+8,dx-5,179],p.stone[0],1);
      Rc(g,-4,top-2,11,2,p.green[0]);Rc(g,-3,top-3,9,2,p.green[1]);
      Rc(g,0,top-4,3,1,p.green[2]);Rc(g,dx-2,top-1,2,1,p.green[2]);
    });
  }
}

function genStage(n){
  const p=STAGE_ART[n],rs=seedR(37+n*71),layers=[];
  const add=(speed,draw,still=false)=>{
    const c=cnv(still?320:LWD,180),g=c.getContext('2d');
    draw(g);pixelize(c,{lv:32,dz:.55,thr:!still});
    layers.push({c,sp:speed,st:still});
  };
  add(0,g=>{
    Rc(g,0,0,320,180,LG(g,0,0,0,180,[[0,p.sky[0]],[.57,p.sky[1]],[1,p.sky[2]]]));
    for(let i=0;i<90;i++){
      const x=rs()*320,y=rs()*116;
      Rc(g,x,y,1,1,i%9===0?p.glow:p.far[2]);
    }
    if(n===1){
      Rc(g,0,40,320,140,RG(g,112,153,0,130,[[0,'#b55a39'],[1,'#b55a3900']]));
      return;
    }
    const x=n===0?229:86,y=n===0?49:117,r=n===0?29:23;
    Rc(g,x-62,y-62,124,124,RG(g,x,y,r*.45,62,[[0,n===0?'#b3d4ff85':'#ffcd8780'],[1,'#efe1c000']]));
    E(g,x,y,r,r,n===0?'#e4e9e1':'#ffe8a6');
    for(let i=0;i<42;i++){
      const a=rs()*TAU,d=(r-4)*Math.sqrt(rs());
      E(g,x+Math.cos(a)*d,y+Math.sin(a)*d,1+rs()*5,.6+rs()*2,
        n===0?['#c4cfca','#aebfbd','#eff3e6'][i%3]:['#ffd794','#ffce86','#fff1bd'][i%3],-.15);
    }
  },true);
  add(.055,g=>{
    for(let i=0;i<7;i++){
      const w=63+rs()*68,y=30+i*13+rs()*12;
      wrapArt(g,i*73+rs()*20,()=>cloudArt(g,y,w,p.cloud,41+i*17+n));
    }
  });
  add(.13,g=>ridgeArt(g,n===2?156:159,n===1?63:82,p.far,75+n));
  add(.23,g=>{
    ridgeArt(g,176,n===2?47:51,p.near,127+n);
    if(n===0){
      for(const [x,y,w,levels] of [[36,153,54,2],[190,159,75,3],[332,150,47,2],[428,158,36,1]]){
        wrapArt(g,x,()=>hallArt(g,y,w,levels,p.glow));
      }
    }else if(n===1){
      for(let i=0;i<10;i++){
        const x=i*48+rs()*16,h=43+rs()*38,w=24+rs()*18;
        wrapArt(g,x,()=>foundryArt(g,166,w,h,p.near,p.glow,44+i));
      }
    }else{
      for(let i=0;i<4;i++)wrapArt(g,i*122,()=>hallArt(g,149+i%2*8,42+i%2*14,2,p.glow));
    }
  });
  add(.53,g=>{
    if(n===0){
      for(let i=0;i<13;i++){
        const x=i*37+rs()*15,top=28+rs()*93,lean=rs()*18-9;
        wrapArt(g,x,()=>bambooArt(g,top,166,2+i%3,lean,p.near,420+i));
      }
    }else if(n===1){
      for(const [x,y,r] of [[49,95,20],[176,119,29],[331,84,24],[452,114,17]]){
        wrapArt(g,x,()=>gearArt(g,y,r,p.stone));
      }
      for(const y of [132,145]){
        Rc(g,0,y,LWD,4,p.stone[0]);Rc(g,0,y,LWD,1,p.stone[2]);
        for(let x=0;x<LWD;x+=24){Rc(g,x,y-2,3,8,p.stone[1]);Rc(g,x+1,y+1,1,1,p.glow);}
      }
    }else{
      for(let i=0;i<7;i++){
        const y=153+rs()*12,w=88+rs()*30;
        wrapArt(g,i*69,()=>cloudArt(g,y,w,p.cloud,201+i*19));
      }
    }
  });
  add(1,g=>{
    if(n===2){
      for(let i=0;i<8;i++){
        const y=176+rs()*8;
        wrapArt(g,i*60,()=>cloudArt(g,y,82,p.cloud,313+i*13));
      }
      return;
    }
    groundArt(g,p,261+n);
    for(let i=0;i<6;i++){
      const y=153+rs()*6;
      wrapArt(g,i*80+14,()=>{
        Rc(g,-3,y+6,7,3,p.stone[0]);Rc(g,-1,y,2,7,p.stone[2]);
        P(g,[-6,y-6,0,y-10,6,y-6],p.stone[1]);
        Rc(g,-3,y-6,6,6,p.stone[0]);Rc(g,-2,y-5,4,4,p.glow);Rc(g,-1,y-4,1,2,'#fff7cc');
      });
    }
  });
  return layers;
}

  const b=AU.c.createBuffer(1,AU.c.sampleRate,AU.c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;AU.nb=b;}

function tone(f,d,t='square',v=.1,sl=0,dl=0){const c=AU.c;if(!c)return;const s=c.currentTime+dl,o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.setValueAtTime(f,s);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*sl),s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(AU.m);o.start(s);o.stop(s+d+.05);}
function nz(d,v=.2,lp=1200,dl=0){const c=AU.c;if(!c)return;const s=c.currentTime+dl,src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();src.buffer=AU.nb;f.type='lowpass';f.frequency.value=lp;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);src.connect(f);f.connect(g);g.connect(AU.m);src.start(s,R()*.5);src.stop(s+d+.05);}

function addShot(x,y,a,s,k,dmg,o){G.sh.push(Object.assign({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,k,dmg,r:k=='cres'?8:k=='tal'?6:k=='big'?26:k=='bigtal'?10:5,l:120,t:0},o));}
function playerFire(){const p=G.p,lv=p.pow;if(p.charge>0)return;p.ft++;
  if(p.ch==0&&p.ft%7==0){const n=[1,3,3,5][lv-1],s=[0,.13,.09,.11][lv-1];for(let i=0;i<n;i++)addShot(p.x+18,p.y-4,(i-(n-1)/2)*s,8.5,'cres',lv>2?5:4.5);sfx('shot');}
  if(p.ch==1&&p.ft%8==0){const n=[2,3,4,5][lv-1];for(let i=0;i<n;i++)addShot(p.x+14,p.y-2+(i-(n-1)/2)*6,(i-(n-1)/2)*.12,6,'tal',4.2,{home:1});sfx('shot');}
  if(p.ch==2&&p.ft%5==0){const n=[1,2,3,3][lv-1];for(let i=0;i<n;i++)addShot(p.x+20,p.y-2+(i-(n-1)/2)*7,(i-(n-1)/2)*(lv>3?.05:.015),12,'arr',lv>3?4.4:3.8);sfx('shot');}
  if(p.ft%10==0)for(let i=0;i<p.opt;i++){const o=p.trail[Math.min(p.trail.length-1,(i+1)*10)]||p;addShot(o.x+6,o.y,0,9,'opt',2.4);}}
function releaseCharge(){const p=G.p;if(p.charge<60){p.charge=0;return;}p.charge=0;sfx('rel');G.shake=6;
  if(p.ch==0)addShot(p.x+20,p.y-4,0,7,'big',3.2,{pierce:1,l:150});
  if(p.ch==1)for(let i=0;i<10;i++)addShot(p.x,p.y,i/10*TAU,4,'bigtal',9,{home:2,l:160});
  if(p.ch==2)G.sh.push({k:'beam',x:p.x+20,y:p.y-2,l:34,t:0,dmg:2.6,r:9,pierce:1});}
function doBomb(){const p=G.p;if(G.state!='play'||p.bombs<=0||G.cut||G.bombFx||p.dead)return;p.bombs--;G.cut={t:0,ch:p.ch};p.inv=Math.max(p.inv,260);sfx('bomb');}

/* ================= 적 처리 ================= */
function killEnemy(e){e.dead=1;G.kills++;boom(e.x,e.y,e.type=='junk'||e.type=='bt'?1.6:1);sfx('boom');coins(e.x,e.y,ET[e.type].co);addScore(ET[e.type].sc,e.x,e.y-10);
  if(e.drop)G.it.push({x:e.x,y:e.y,vx:-1,vy:-1.5,k:e.drop,t:0});else if(e.type=='bt'&&R()<.35)G.it.push({x:e.x,y:e.y,vx:-1,vy:-1.5,k:'P',t:0});}
function updEnemy(e){e.t++;if(e.fl)e.fl--;const fr=G.dm.fr;
  switch(e.mv){
    case'sine':e.x+=e.vx;e.y=e.y0+Math.sin(e.t*e.fq+e.ph)*e.amp;break;
    case'line':e.x+=e.vx;e.y+=e.vy;break;
    case'swoop':e.x+=e.vx;e.y+=e.vy;if(e.t==e.turn){const a=aimA(e.x,e.y);e.vx=Math.cos(a)*3.3-.8;e.vy=Math.sin(a)*3.3;}break;
    case'stop':if(e.t<e.st){e.x+=(e.tx-e.x)*.05;e.y+=(e.ty-e.y)*.05;}else if(e.t>e.st+e.stay){e.vx-=.06;e.x+=e.vx;e.y+=e.vy;}else{e.y+=Math.sin(e.t*.04)*.4;e.vx=0;e.vy=e.y<180?-.4:.4;}break;
    case'dive':e.x+=e.vx;if(e.t<50)e.y+=(G.p.y-e.y)*.04;break;
    case'ground':e.x-=1.6;break;
  }
  if(e.x>W+80||e.x<-80||e.y<-80||e.y>H+80){if(e.t>60)e.dead=1;return;}
  if(e.x>W-10)return;e.ft--;if(e.ft>0)return;
  switch(e.type){
    case'df':if(R()<.35)eb(e.x,e.y,aimA(e.x,e.y),2.6);e.ft=9999;break;
    case'bt':if(e.mv=='stop'&&e.t>e.st&&e.t<e.st+e.stay){fan(e.x-10,e.y,3,3,.22,'f');if(G.stage>0)fan(e.x-10,e.y,2,2.2,.6,'b');e.ft=55*fr;}else e.ft=10;break;
    case'ln':if(e.t>e.st&&e.t<e.st+e.stay){ring(e.x,e.y,G.stage>1?16:12,2.2,'b',e.t*.05);e.ft=70*fr;}else e.ft=10;break;
    case'can':eb(e.x,e.y-8,aimA(e.x,e.y-8),3,'f');e.ft=80*fr;break;
    case'ket':if(e.t>e.st){fan(e.x-8,e.y,2,3.2,.15,'f');e.ft=60*fr;}else e.ft=10;break;

function update(){
  if(G.state!='play'||G.paused)return;
  const p=G.p;
  if(G.cut){G.cut.t++;if(G.cut.t==56){startBombFx();}if(G.cut.t>70)G.cut=null;if(G.cut&&G.cut.t<56)return;}
  G.t++;G.scroll+=1.6;if(G.shake)G.shake--;if(G.flash)G.flash--;
  if(G.talk){G.talk.t++;if(G.talk.t>240)G.talk=null;}
  // 진행
  if(G.phase=='intro'&&G.t>150){G.phase='waves';G.q=[];}
  if(G.phase=='waves'){const wi=Math.floor((G.t-150)/WGAP);if(wi>=G.waveI&&G.waveI<DECK[G.stage].length){WAVES[DECK[G.stage][G.waveI]]();G.waveI++;}
    for(let i=G.q.length-1;i>=0;i--)if(G.q[i].t<=G.t){G.q[i].f();G.q.splice(i,1);}
    if(G.t>BOSS_AT&&G.en.length==0){G.phase='warn';G.pt0=G.t;sfx('warn');}}
  else if(G.q&&G.q.length){for(let i=G.q.length-1;i>=0;i--)if(G.q[i].t<=G.t){G.q[i].f();G.q.splice(i,1);}}
  if(G.phase=='warn'){if((G.t-G.pt0)%60==0)sfx('warn');if(G.t-G.pt0>170){G.phase='boss';G.boss=makeBoss(G.stage);}}
  if(G.phase=='clear'&&G.t-G.pt0>150){stageClear();return;}
  // 플레이어
  if(!p.dead){
    let mx=IN.dx,my=IN.dy;IN.dx=0;IN.dy=0;const sp2=CH[p.ch].spd*(p.charge>0?.55:1);
    let kx=(IN.k.ArrowRight||IN.k.d?1:0)-(IN.k.ArrowLeft||IN.k.a?1:0),ky=(IN.k.ArrowDown||IN.k.s?1:0)-(IN.k.ArrowUp||IN.k.w?1:0);
    if(kx&&ky){kx*=.7071;ky*=.7071;}mx+=kx*sp2;my+=ky*sp2;
    const ml=Math.hypot(mx,my),lim=sp2*2.6;if(ml>lim){mx*=lim/ml;my*=lim/ml;}
    p.x=cl(p.x+mx,18,W-24);p.y=cl(p.y+my,24,G.stage<2?300:H-18);p.frame++;
    p.trail.unshift({x:p.x,y:p.y});if(p.trail.length>40)p.trail.pop();
    if(p.inv)p.inv--;
    if(IN.chg||IN.k.c||IN.k.C){if(p.charge<60){p.charge++;if(p.charge==60)sfx('chg');}else p.charge=60;if(p.charge<2)p.charge=2;}else if(p.charge>0)releaseCharge();
    if(G.phase!='clear')playerFire();
  }
  // 샷
  for(const s of G.sh){s.t++;s.l--;
    if(s.k=='beam'){s.x=p.x+20;s.y=p.y-2;continue;}
    if(s.home){let best=null,bd=1e9;for(const e of G.en){const d=dist2(e.x,e.y,s.x,s.y);if(d<bd&&e.x>s.x-30){bd=d;best=e;}}if(G.boss)for(const q of G.boss.parts)if(!q.dead){const d=dist2(q.wx,q.wy,s.x,s.y);if(d<bd){bd=d;best={x:q.wx,y:q.wy};}}
      if(best&&s.t>(s.home==2?10:4)){const a=Math.atan2(best.y-s.y,best.x-s.x),sp3=Math.hypot(s.vx,s.vy)+.08,ca=Math.atan2(s.vy,s.vx);let da=a-ca;while(da>PI)da-=TAU;while(da<-PI)da+=TAU;const na=ca+cl(da,-.12,.12);s.vx=Math.cos(na)*Math.min(sp3,9);s.vy=Math.sin(na)*Math.min(sp3,9);}}
    s.x+=s.vx;s.y+=s.vy;if(s.x>W+40||s.x<-40||s.y<-40||s.y>H+40)s.l=0;}
  // 적
  for(const e of G.en)if(!e.dead)updEnemy(e);
  if(G.boss)updBoss(G.boss);
  // 충돌: 샷 vs 적
  for(const s of G.sh){if(s.l<=0)continue;
    if(s.k=='beam'){for(const e of G.en)if(!e.dead&&e.x>s.x&&Math.abs(e.y-s.y)<e.r+9)dmgEnemy(e,s.dmg);if(G.boss)for(const q of G.boss.parts)if(!q.dead&&q.wx>s.x&&Math.abs(q.wy-s.y)<q.r+9)dmgPart(G.boss,q,s.dmg);continue;}
    for(const e of G.en){if(e.dead||e.x>W+4)continue;const rr=e.r+s.r;if(dist2(e.x,e.y,s.x,s.y)<rr*rr){dmgEnemy(e,s.dmg);if(!s.pierce){s.l=0;hitSpark(s.x,s.y);break;}}}
    if(s.l>0&&G.boss)for(const q of G.boss.parts){if(q.dead)continue;const rr=q.r+s.r;if(dist2(q.wx,q.wy,s.x,s.y)<rr*rr){dmgPart(G.boss,q,s.dmg);if(!s.pierce){s.l=0;hitSpark(s.x,s.y);sfx('hit');break;}}}}
  // 폭탄 효과
  if(G.bombFx)updBomb();
  // 적탄
  for(const b of G.eb){b.t++;b.x+=b.vx;b.y+=b.vy;if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20)b.dead=1;
    if(!p.dead&&!b.dead){const rr=b.r*.55+2.5;if(dist2(b.x,b.y,p.x,p.y)<rr*rr){if(p.inv<=0){b.dead=1;hurt();}}}}
  // 몸통 충돌
  if(!p.dead&&p.inv<=0){for(const e of G.en)if(!e.dead&&dist2(e.x,e.y,p.x,p.y)<(e.r*.7+3)**2){hurt();break;}
    if(G.boss&&!G.boss.die)for(const q of G.boss.parts)if(!q.dead&&dist2(q.wx,q.wy,p.x,p.y)<(q.r*.75)**2){hurt();break;}}
  // 엽전
  for(const c of G.co){c.t++;c.vx*=.93;c.vy*=.93;c.x+=c.vx-.4;c.y+=c.vy;
    const d=dist2(c.x,c.y,p.x,p.y);if(!p.dead&&(c.t>40||d<70*70)){const a=Math.atan2(p.y-c.y,p.x-c.x),v=Math.min(12,3+c.t*.08);c.x+=Math.cos(a)*v;c.y+=Math.sin(a)*v;}
    if(!p.dead&&d<16*16){c.dead=1;G.coins++;G.stCoins++;G.mult=Math.min(10,G.mult+.04);G.maxMult=Math.max(G.maxMult,G.mult);G.multT=0;G.score+=Math.round(100*Math.floor(G.mult*10)/10);sfx('coin');}
    if(c.x<-20)c.dead=1;}
  G.multT++;if(G.multT>150&&G.mult>1)G.mult=Math.max(1,G.mult-.01);
  // 아이템
  for(const it of G.it){it.t++;it.vx*=.97;it.vy*=.97;it.x+=it.vx-.5;it.y+=it.vy+Math.sin(it.t*.08)*.3;if(it.x<-20)it.dead=1;
    if(!p.dead&&dist2(it.x,it.y,p.x,p.y)<22*22){it.dead=1;getItem(it.k);}}
  // 파티클
  for(const q of G.pt){q.l--;q.x+=q.vx;q.y+=q.vy;q.vx*=.95;q.vy*=.95;if(q.k=='s')q.vy-=.02;}
  for(const q of G.pop){q.l--;q.y-=.5;}
  // 정리
  G.sh=G.sh.filter(s=>s.l>0);G.en=G.en.filter(e=>!e.dead);G.eb=G.eb.filter(b=>!b.dead);G.co=G.co.filter(c=>!c.dead);G.it=G.it.filter(i=>!i.dead);G.pt=G.pt.filter(q=>q.l>0);G.pop=G.pop.filter(q=>q.l>0);
  if(G.pt.length>600)G.pt.splice(0,G.pt.length-600);if(G.co.length>400)G.co.splice(0,G.co.length-400);
  if(G.score>G.hi){G.hi=G.score;}
}

  document.getElementById('nx').onclick=()=>{i++;if(i>=STORY.length)newRun();else show();};document.getElementById('sk').onclick=()=>newRun();};show();}
function stageClear(){const p=G.p;if(G.stage>=2){ending();return;}G.state='clear';BG.on=false;showUI();if(p.hp<p.max)p.hp++;saveHi();
  showOv(`<div class="pan"><h2>제${G.stage+1}막 돌파!</h2><p>점수 <b style="color:#f5c542">${G.score.toLocaleString()}</b> · 모은 엽전 ${G.stCoins.toLocaleString()}닢 · 처치 ${G.kills}</p><p>기력이 1 회복되었습니다.</p><div class="row"><button class="mb" id="nx">제${G.stage+2}막 「${STG[G.stage+1].name}」로</button></div></div>`);
  document.getElementById('nx').onclick=()=>{auInit();startStage(G.stage+1);};}
function ending(){G.state='clear';BG.on=false;showUI();saveHi();
  showOv(`<div class="pan"><h2>달빛을 되찾다</h2><p>흑룡함이 운해 아래로 가라앉고, 밤하늘에 다시 둥근 달이 떠올랐다.</p><p>${CH[G.ch].full}의 이름이 사신의 전설에 새겨졌다.</p><p>최종 점수 <b style="color:#f5c542">${G.score.toLocaleString()}</b>${G.cont?` · 이어하기 ${G.cont}회`:''} · 최대 엽전 배율 ×${G.maxMult.toFixed(1)}</p><div class="row"><button class="mb" id="t">처음으로</button></div></div>`);
  document.getElementById('t').onclick=toTitle;}
function gameOver(){if(G.state!='play')return;G.state='over';BG.on=false;showUI();saveHi();
  showOv(`<div class="pan"><h2>격추당했다…</h2><p>점수 ${G.score.toLocaleString()} · 제${G.stage+1}막 「${STG[G.stage].name}」</p><div class="row"><button class="mb" id="c">이어하기 (점수 초기화)</button><button class="mb alt" id="t">처음으로</button></div></div>`);
  document.getElementById('c').onclick=()=>{auInit();const p=G.p;G.cont++;G.score=0;p.hp=p.max;p.dead=0;p.bombs=3;p.inv=180;G.state='play';BG.on=true;showUI();hideOv();};
  document.getElementById('t').onclick=toTitle;}
function saveHi(){if(G.score>G.hi)G.hi=G.score;try{localStorage.setItem('ssb_hi',G.hi);}catch(e){}}
function toTitle(){G.state='title';G.menuStage=0;BG.on=false;showUI();hideOv();}
function pauseGame(on){if(G.state!='play')return;G.paused=on;if(on){showOv(`<div class="pan"><h2>잠시 멈춤</h2><div class="row"><button class="mb" id="r">계속</button><button class="mb alt" id="t">처음으로</button></div></div>`);document.getElementById('r').onclick=()=>pauseGame(false);document.getElementById('t').onclick=()=>{G.paused=false;saveHi();toTitle();};}else hideOv();}

/* ================= 입력 ================= */
let scale=1;const drag={id:null,x:0,y:0};
function fit(){const vw=window.innerWidth,vh=window.innerHeight;scale=Math.min(vw/W,vh/H);const w=Math.floor(W*scale),h=Math.floor(H*scale),l=Math.floor((vw-w)/2),t=Math.floor((vh-h)/2);
  for(const el of[cv,stEl]){el.style.width=w+'px';el.style.height=h+'px';el.style.left=l+'px';el.style.top=t+'px';}
  ov.style.inset='0';const bs=Math.max(58,Math.min(96,h*.2));
  bB.style.width=bB.style.height=bs+'px';bC.style.width=bC.style.height=bs*.92+'px';bB.style.right=(w*.02)+'px';bB.style.bottom=(h*.04)+'px';bC.style.right=(w*.02+bs*1.08)+'px';bC.style.bottom=(h*.03)+'px';
  bB.style.fontSize=bC.style.fontSize=(bs*.2)+'px';bP.style.left=(w*.015)+'px';bM.style.left=(w*.015+Math.max(34,w*.05)+8)+'px';bP.style.width=bM.style.width=Math.max(34,w*.05)+'px';}
window.addEventListener('resize',fit);fit();
cv.addEventListener('pointerdown',e=>{e.preventDefault();auInit();
  if(G.state=='play'&&!G.paused){drag.id=e.pointerId;drag.x=e.clientX;drag.y=e.clientY;try{cv.setPointerCapture(e.pointerId);}catch(_){} }});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==drag.id)return;IN.dx+=(e.clientX-drag.x)/scale*1.25;IN.dy+=(e.clientY-drag.y)/scale*1.25;drag.x=e.clientX;drag.y=e.clientY;});
const endDrag=e=>{if(e.pointerId===drag.id)drag.id=null;};cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
function hold(el,down,up){el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();auInit();el.classList.add('on');try{el.setPointerCapture(e.pointerId);}catch(_){}down();});
  const u=e=>{el.classList.remove('on');up&&up();};el.addEventListener('pointerup',u);el.addEventListener('pointercancel',u);el.addEventListener('lostpointercapture',u);}
hold(bB,doBomb);hold(bC,()=>{IN.chg=true;},()=>{IN.chg=false;});
bP.addEventListener('click',()=>pauseGame(!G.paused));
bM.addEventListener('click',()=>{auInit();AU.muted=!AU.muted;if(AU.m)AU.m.gain.value=AU.muted?0:.5;bM.textContent=AU.muted?'✕':'♪';try{localStorage.setItem('ssb_mute',AU.muted?'1':'0');}catch(e){}});
window.addEventListener('keydown',e=>{IN.k[e.key]=true;if(e.target!==startGame&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  if(G.state==='title'&&e.target!==startGame&&(e.key==='Enter'||e.key==='z'||e.key===' '))openSelection();
  if(G.state=='play'&&(e.key=='x'||e.key=='X'))doBomb();if(G.state=='play'&&(e.key=='Escape'||e.key=='p'))pauseGame(!G.paused);});
window.addEventListener('keyup',e=>{IN.k[e.key]=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state=='play'&&!G.paused)pauseGame(true);});
window.addEventListener('blur',()=>{IN.k={};IN.chg=false;});

/* ================= 루프 ================= */
let last=performance.now(),acc=0;
function frame(t){requestAnimationFrame(frame);let dt=t-last;last=t;if(dt>100)dt=100;acc+=dt;let n=0;
  while(acc>=16.667&&n<4){if(G.state=='play')update();else{G.menuT=(G.menuT||0)+1;G.menuScroll=(G.menuScroll||0)+.8;}acc-=16.667;n++;}
  if(n>=4)acc=0;try{render();}catch(e){console.error(e);}bgm();}
try{buildAssets();}catch(e){console.error(e);document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;top:0;color:#f88">초기화 오류: '+e.message+'</p>');}
showUI();requestAnimationFrame(frame);
if(document.fonts)document.fonts.ready.then(()=>{});
window.__G=G;window.__api={update,newRun,startStage,doBomb,selectScreen,makeBoss,IN,A};
}
</script>
</body>
