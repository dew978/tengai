:root{color-scheme:dark;--gold:#f5c542;--ink:#f3ecd8;--navy:#0b1230;--teal:#45d6c8;--red:#d8352a}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05060c;color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none;font-family:"Sasin Serif","Sasin Symbols",serif}
#c{position:absolute;background:#000;touch-action:none}
#landscape{position:fixed;inset:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#landscape #titleScreen{position:absolute;inset:auto;padding:clamp(8px,calc(var(--frame-height)*.044),32px) 12px}
#landscape .title-heading h1{font-size:clamp(32px,calc(var(--frame-height)*.15),128px)}
#landscape .title-seal{font-size:clamp(10px,calc(var(--frame-height)*.027),22px)}
#landscape #startGame{font-size:clamp(16px,calc(var(--frame-height)*.052),24px)}
#titleScreen[hidden]{display:none}
#titleScreen{position:fixed;inset:0;z-index:4;display:grid;grid-template-rows:auto 1fr auto;align-items:center;justify-items:center;padding:clamp(16px,4.4vh,48px) 16px;overflow:hidden;isolation:isolate;background:#111a31;text-align:center}
#titleScreen::before,#titleScreen::after{content:"";position:absolute;inset:0;pointer-events:none}
#titleScreen::before{z-index:-2;background:url("__TITLE_IMAGE__") center 49%/cover no-repeat}
#titleScreen::after{z-index:-1;background:linear-gradient(180deg,#0b102bd9 0%,#101a3626 38%,transparent 59%,#0a1027e8 100%)}
.title-heading{align-self:start;display:grid;justify-items:center;gap:3px}
.title-heading h1{margin:0;color:#ffe7b0;font:400 clamp(52px,15vh,128px)/.95 "Sasin Brush","Sasin Serif","Sasin Symbols",serif;text-shadow:0 3px #562b33,0 5px 0 #140f22,0 8px 28px #080b1e}
.title-seal{display:inline-block;padding:2px 8px;border:1px solid #f0a977;background:#803842;color:#ffe8bd;font:700 clamp(12px,2.3vh,22px)/1.25 "Sasin Serif","Sasin Symbols",serif;letter-spacing:.18em}
.title-sub{margin-top:4px;color:#fff3d6;font:400 clamp(13px,2.6vh,20px)/1.2 "Sasin Display","Sasin Symbols",sans-serif;text-shadow:0 2px 6px #0a0d22}
.title-actions{grid-row:3;display:grid;justify-items:center;gap:8px}
#startGame{min-width:146px;min-height:46px;padding:8px 25px;border-radius:3px;border-color:#ffd990;box-shadow:0 0 0 3px #201827,0 0 28px #de89594f;font-size:clamp(18px,3vh,24px)}
#titleBest{color:#ffddb0;text-shadow:0 2px 4px #090c1c;font-size:13px}
#st{position:absolute;pointer-events:none}
#st>*{pointer-events:auto}
.btn{position:absolute;border-radius:50%;border:2px solid rgba(245,197,66,.85);background:radial-gradient(circle at 40% 35%,rgba(120,30,30,.75),rgba(30,8,10,.75));color:#ffe9a8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Sasin Display","Sasin Symbols",sans-serif;touch-action:none;padding:0;box-shadow:0 0 12px rgba(0,0,0,.6),inset 0 0 10px rgba(255,200,80,.25)}
.btn b{font-family:"Sasin Brush","Sasin Symbols",serif;font-size:1.9em;line-height:.9;font-weight:400}
.btn small{font-size:.62em;letter-spacing:.02em;opacity:.9}
.btn.on{background:radial-gradient(circle at 40% 35%,rgba(255,170,60,.9),rgba(140,40,10,.85));transform:scale(.94)}
#bChg{border-color:rgba(69,214,200,.9);background:radial-gradient(circle at 40% 35%,rgba(20,90,100,.75),rgba(5,20,30,.75));color:#bff7f0}
#bChg.on{background:radial-gradient(circle at 40% 35%,rgba(90,240,220,.9),rgba(10,80,90,.85))}
#bPause,#bMute,#bFull{position:absolute;bottom:3%;width:7%;aspect-ratio:1;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(5,8,20,.55);color:#fff;font:700 13px "Sasin Display","Sasin Symbols",sans-serif;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
#bMute,#bFull{z-index:5}
#bFull svg{width:56%;height:56%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.k{position:absolute;right:-5px;top:-7px;min-width:15px;padding:1px 3px;border:1px solid rgba(255,255,255,.45);border-radius:4px;background:#0b0f1fe6;color:#e8eefc;font:700 10px/1.2 system-ui,sans-serif;font-style:normal;letter-spacing:0;pointer-events:none}
.btn .k{right:4%;top:2%}
kbd{display:inline-block;margin-left:6px;padding:0 4px;border:1px solid currentColor;border-radius:4px;font:700 11px/1.5 system-ui,sans-serif;opacity:.7;vertical-align:middle}
@media (hover:none) and (pointer:coarse){.k,kbd{display:none}}
#ov{position:absolute;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(8,10,23,.5);overflow:auto}
#ov.show{display:flex}
.pan{width:min(94%,760px);max-height:96%;padding:14px 18px 16px;text-align:center;background:linear-gradient(155deg,#25314df1,#111628fa 57%,#211925fa);border:1px solid #c49e63;border-radius:3px;box-shadow:0 0 0 3px #131420,0 0 0 4px #705642,0 10px 40px rgba(0,0,0,.6);overflow:auto}
.pan h2{margin:0 0 4px;font:400 clamp(28px,6vw,46px)/1 "Sasin Brush","Sasin Symbols",serif;color:var(--gold);text-shadow:0 2px 0 #5a1a10,0 0 14px rgba(255,180,60,.4)}
.pan p{margin:6px 0;font-size:clamp(13px,2.2vw,16px);line-height:1.5}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.mb{min-height:44px;padding:8px 18px;border-radius:8px;border:2px solid var(--gold);background:linear-gradient(180deg,#7a1c14,#3a0a08);color:#ffe9a8;font:400 17px "Sasin Display","Sasin Symbols",sans-serif;cursor:pointer}
.mb.alt{border-color:var(--teal);background:linear-gradient(180deg,#0f4a50,#06202a);color:#c8fff8}
.mb:focus-visible{outline:3px solid #fff;outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.card{border:2px solid rgba(255,255,255,.18);border-radius:3px;padding:6px 6px 8px;background:linear-gradient(145deg,#1e2940,#131727);cursor:pointer;text-align:center;font-family:"Sasin Display","Sasin Symbols",sans-serif}
.card.sel{border-color:var(--gold);box-shadow:0 0 14px rgba(245,197,66,.45);background:rgba(90,30,10,.35)}
.card img{width:100%;display:block;border-radius:4px}
.card .num{float:left;font:700 11px/1 system-ui,sans-serif;opacity:.6}
.card .sp{height:52px;object-fit:contain;margin:2px auto 0}
.card h3{margin:2px 0 0;font:400 clamp(20px,3.6vw,28px)/1 "Sasin Brush","Sasin Symbols",serif;color:var(--gold)}
.card small{display:block;font-family:"Sasin Serif","Sasin Symbols",serif;font-size:12px;line-height:1.35;opacity:.92;margin-top:2px}
.seg{display:inline-flex;border:2px solid rgba(255,255,255,.25);border-radius:8px;overflow:hidden}
.seg button{min-height:40px;padding:6px 14px;border:0;background:rgba(0,0,0,.35);color:#ddd;font:400 15px "Sasin Display","Sasin Symbols",sans-serif}
.seg button.sel{background:#f5c542;color:#2a1405}
.keys{font-size:12px!important;opacity:.75}
.title-sub{display:block}
.chips{gap:8px}
.chip{min-height:40px;padding:6px 14px;border-radius:20px;border:2px solid var(--c);background:rgba(0,0,0,.35);color:#ddd;font:400 16px "Sasin Display","Sasin Symbols",sans-serif;cursor:pointer;opacity:.55}
.chip.on{background:var(--c);color:#1a1020;opacity:1}
.qn{display:inline-block;min-width:18px;margin-right:6px;font:700 11px/18px system-ui,sans-serif;border-radius:9px;background:rgba(0,0,0,.3)}
.quiz{text-align:left}
.qtag{display:inline-block;padding:1px 10px;border-radius:10px;background:var(--c);color:#1a1020;font:700 12px/1.6 "Sasin Display","Sasin Symbols",sans-serif}
.qh{display:inline;margin:0 0 0 8px;font:400 15px "Sasin Display","Sasin Symbols",sans-serif;color:#ffcf8a}
.qq{font-size:clamp(16px,3vw,22px)!important;line-height:1.45!important;margin:10px 2px!important;color:#fff}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qo{text-align:left;font-size:clamp(14px,2.6vw,18px)}
.qo .qn{background:rgba(255,255,255,.15)}
.qo.right{background:linear-gradient(180deg,#1f7a45,#0c3a20);border-color:#7dff9a}
.qo.wrong{background:linear-gradient(180deg,#7a1f2a,#3a0c12);border-color:#ff8a8a}
.qo:disabled{cursor:default}
.qfb{min-height:1.5em}
.pan [hidden]{display:none!important}
.qfb .ok{color:#7dff9a}.qfb .ng{color:#ff9a8a}
.qfb small{opacity:.85}
.score{font-size:clamp(15px,2.6vw,19px)!important}
.stab{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;width:min(100%,420px);margin:8px auto;text-align:left}
.stab .qtag{text-align:center}
.stab .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.stab .bar i{display:block;height:100%;background:var(--c)}
.stab .n{font:700 15px "Sasin Display","Sasin Symbols",sans-serif;color:#fff;white-space:nowrap}
.stab .n small{opacity:.6;font-weight:400}
.stab .tot{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.18);padding-top:6px;text-align:center;font-size:16px}
.note{font-size:13px!important;opacity:.85}
@media (max-height:420px){.qq{margin:4px 2px!important}.qopts{gap:5px}.qo{min-height:38px;padding:4px 10px}}

  for(const shift of [-LWD,0,LWD]){
    g.save();g.translate(Math.round(x)+shift,0);draw();g.restore();

}

  const rs=seedR(seed),lobes=[];
  for(let x=5;x<w;x+=7+rs()*10){
    const r=5+rs()*15,cy=y-Math.sin(x/w*PI)*(5+w*.05)+rs()*7;
    lobes.push([x,cy,r]);
  }
  E(g,w*.51,y+3,w*.53,8,palette[0]);
  for(const [x,cy,r] of lobes)E(g,x,cy,r,r*.65,palette[0]);
  for(const [x,cy,r] of lobes)E(g,x-1,cy-r*.20,r*.87,r*.48,palette[1]);
  for(const [x,cy,r] of lobes){
    P(g,[x-r*.85,cy-r*.29,x-r*.45,cy-r*.58,x,cy-r*.67,x+r*.44,cy-r*.54,

const QZ={decks:{},order:[],si:0,count:0,log:[],retry:[]};
function qzBuild(){
  QZ.decks={};QZ.si=0;QZ.count=0;QZ.log=[];QZ.retry=[];
  for(const s of QS.subj){
    const list=QBANK.filter(q=>q[0]===s&&(q[1]===0||QS.grade===0||q[1]===QS.grade)).map(q=>({fixed:q}));
    if(s==='수학')for(const g of QS.grade?[QS.grade]:[5,6])for(const gen of QGEN[g])for(let i=0;i<3;i++)list.push({gen,g});
    QZ.decks[s]={list:shuffle(list),i:0};
  }
  QZ.order=shuffle(QS.subj.slice());
}
function qzMake(it){
  if(it.gen){const r=it.gen();return {s:'수학',g:it.g,q:r.q,a:r.a,w:r.w,e:r.e||''};}
  const q=it.fixed;return {s:q[0],g:q[1],q:q[2],a:q[3],w:[q[4],q[5],q[6]],e:q[7]||'',c:q[8]||''};
}
// n지선다 문제 하나. fits(보기 배열)로 화면에 들어갈 길이인지 거른다.
function qzNext(n,fits){
  let last=null;
  for(let tries=0;tries<60;tries++){
    let item,ri2=tries<20?QZ.retry.findIndex(x=>x.due<=QZ.count):-1;
    if(ri2>=0)item=QZ.retry[ri2].q;
    else{const s=QZ.order[QZ.si++%QZ.order.length],d=QZ.decks[s];if(!d||!d.list.length)continue;if(d.i>=d.list.length){shuffle(d.list);d.i=0;}item=qzMake(d.list[d.i++]);}
    if(item.w.length<n-1)continue;
    const opts=shuffle([item.a,...shuffle(item.w.slice()).slice(0,n-1)]),qq={...item,opts,ans:opts.indexOf(item.a)};
    last=qq;if(fits&&!fits(opts))continue;
    if(ri2>=0)QZ.retry.splice(ri2,1);
    QZ.count++;return qq;
  }
  QZ.count++;return last;
}
function qzRecord(qq,choice,mode){
  const ok=choice===qq.ans;
  QZ.log.push({q:qq,pick:choice>=0?qq.opts[choice]:null,ok,mode,stage:G.stage});
  if(!ok&&!qq.again)QZ.retry.push({q:{s:qq.s,g:qq.g,q:qq.q,a:qq.a,w:qq.w,e:qq.e,again:1},due:QZ.count+4});
  return ok;
}

    // decode()는 화면이 가려진 탭에서 멈출 수 있어 load 이벤트로 기다린다.
    const img=new Image();
    await new Promise((ok,fail)=>{img.onload=ok;img.onerror=fail;img.src=url;});
    return [key,img];
  })));
  // 고해상도 원화를 논리 크기(logicalWidth/Height)의 최대 8배 캔버스로 줄여 둔다.
  function sprite(key,original,pose=0,squash=1){
    const image=illustrations[key];if(!image)return original;
    const w=original.logicalWidth||original.width,h=original.logicalHeight||original.height;
    const k=cl(Math.max(image.width/w,image.height/h),3,8);
    const c=cnv(Math.round(w*k),Math.round(h*k)),g=c.getContext('2d');
    const scale=Math.min(c.width/image.width,c.height/image.height);
    const sw=image.width*scale*squash,sh=image.height*scale*(pose ? 0.97 : 1);
    fitDraw(g,image,(c.width-sw)/2,(c.height-sh)/2+(pose?sh*.015:0),sw,sh);
    c.logicalWidth=w;c.logicalHeight=h;
    return c;
  }
  A.pl=A.pl.map((frames,i)=>frames.map((old,f)=>sprite('hero'+i,old,f)));
  A.por=A.por.map((old,i)=>{

    const q=POR_SCALE,c=cnv(150*q,90*q),g=c.getContext('2d');
    const scale=Math.min(145/im.width,110/im.height)*q;
    fitDraw(g,im,(c.width-im.width*scale)/2,q,im.width*scale,im.height*scale);
    c.logicalWidth=150;c.logicalHeight=90;c.ps=q;
    return c;
  });
  for(const key of ['df','bt','bat','ln','sup','can','ket','junk','phx'])
    A[key]=A[key].map((old,f)=>sprite(key,old,f));

  A.coin=A.coin.map((old,f)=>sprite('coin',old,0,[1,.7,.25,.7][f]));
  A.eb={f:sprite('ebF',A.eb.f),b:sprite('ebB',A.eb.b),r:sprite('ebR',A.eb.r)};
  for(const k of 'PBOH')A.it[k]=sprite('it'+k,A.it[k]);
  A.ans=A.ans.map((old,f)=>sprite('qlamp',old,f));A.gate=sprite('gate',A.gate);
  A.dokB=sprite('dok',A.dokB);
  const damage=A.dokB.getContext('2d');
  damage.globalCompositeOperation='source-atop';
  damage.fillStyle='rgba(177,53,26,.27)';

function fitDraw(g,img,x,y,w,h){
  let src=img,sw=img.width,sh=img.height;

    const nw=Math.ceil(sw/2),nh=Math.ceil(sh/2),c=cnv(nw,nh),cg=c.getContext('2d');
    cg.imageSmoothingQuality='high';cg.drawImage(src,0,0,sw,sh,0,0,nw,nh);src=c;sw=nw;sh=nh;
  }
  g.imageSmoothingQuality='high';g.drawImage(src,0,0,sw,sh,x,y,w,h);
}

function updEnemy(e){e.t++;if(e.fl)e.fl--;const fr=G.dm.fr;
  switch(e.mv){
    case'sine':e.x+=e.vx;e.y=e.y0+Math.sin(e.t*e.fq+e.ph)*e.amp;break;
    case'line':e.x+=e.vx;e.y+=e.vy;break;
    case'swoop':e.x+=e.vx;e.y+=e.vy;if(e.t==e.turn){const a=aimA(e.x,e.y);e.vx=Math.cos(a)*3.3-.8;e.vy=Math.sin(a)*3.3;}break;
    case'stop':if(e.t<e.st){e.x+=(e.tx-e.x)*.05;e.y+=(e.ty-e.y)*.05;}else if(e.t>e.st+e.stay){e.vx-=.06;e.x+=e.vx;e.y+=e.vy;}else{e.y+=Math.sin(e.t*.04)*.4;e.vx=0;e.vy=e.y<180?-.4:.4;}break;
    case'dive':e.x+=e.vx;if(e.t<50)e.y+=(G.p.y-e.y)*.04;break;
    case'ground':e.x-=1.6;break;
  }
  if(e.x>W+80||e.x<-80||e.y<-80||e.y>H+80){if(e.t>60)e.dead=1;return;}
  if(e.x>W-10)return;e.ft--;if(e.ft>0)return;
  switch(e.type){
    case'df':if(R()<.35)eb(e.x,e.y,aimA(e.x,e.y),2.6);e.ft=9999;break;
    case'bt':if(e.mv=='stop'&&e.t>e.st&&e.t<e.st+e.stay){fan(e.x-10,e.y,3,3,.22,'f');if(G.stage>0)fan(e.x-10,e.y,2,2.2,.6,'b');e.ft=55*fr;}else e.ft=10;break;
    case'ln':if(e.t>e.st&&e.t<e.st+e.stay){ring(e.x,e.y,G.stage>1?16:12,2.2,'b',e.t*.05);e.ft=70*fr;}else e.ft=10;break;
    case'can':eb(e.x,e.y-8,aimA(e.x,e.y-8),3,'f');e.ft=80*fr;break;
    case'ket':if(e.t>e.st){fan(e.x-8,e.y,2,3.2,.15,'f');e.ft=60*fr;}else e.ft=10;break;
    case'junk':if(e.t>e.st){for(let i=0;i<3;i++)eb(e.x-20,e.y-8+i*8,PI,3,'f');fan(e.x,e.y,5,2.4,.3,'r');e.ft=75*fr;}else e.ft=10;break;
    case'bat':if(R()<.4)eb(e.x,e.y,aimA(e.x,e.y),3,'r');e.ft=9999;break;
    case'sup':e.ft=9999;break;
  }}
function dmgEnemy(e,d){if(e.type=='ans'){e.hitT=G.t;e.fl=3;return;}e.hp-=d;e.fl=3;if(e.hp<=0&&!e.dead)killEnemy(e);}

function makeBoss(n){const hp=G.dm.hp;let b;
  if(n==0)b={n,x:W+140,y:170,tx:500,ty:170,t:0,parts:[{k:'clubA',ox:-30,oy:-70,r:24,hp:620*hp},{k:'clubB',ox:-30,oy:72,r:24,hp:620*hp},{k:'core',ox:-4,oy:0,r:40,hp:2400*hp,core:1}]};
  if(n==1){b={n,x:W+80,y:170,t:0,hist:[],parts:[{k:'core',ox:0,oy:0,r:26,hp:2600*hp,core:1}]};for(let i=0;i<10;i++)b.parts.push({k:'seg',i,r:20,hp:170*hp,ox:0,oy:0});}
  if(n==2)b={n,x:W+200,y:150,tx:460,ty:150,t:0,parts:[{k:'tur',ox:-70,oy:-2,r:16,hp:520*hp},{k:'tur',ox:-5,oy:-2,r:16,hp:520*hp},{k:'tur',ox:60,oy:-2,r:16,hp:520*hp},{k:'drg',ox:-150,oy:22,r:30,hp:1500*hp},{k:'core',ox:110,oy:-8,r:28,hp:2400*hp,core:1}]};
  b.parts.forEach(p=>{p.max=p.hp;p.fl=0;p.dead=0;p.wx=0;p.wy=0;});b.max=b.parts.reduce((s,p)=>s+p.max,0);b.entry=150;b.ft=60;b.ph=1;b.die=0;return b;}
function bossHp(b){return b.parts.reduce((s,p)=>s+Math.max(0,p.hp),0);}
function partsLeft(b){return b.parts.filter(p=>!p.core&&!p.dead).length;}
function dmgPart(b,p,d){if(b.entry>0||b.die)return;if(p.core&&partsLeft(b)>0&&b.n!=1)d*=.2;if(p.core&&b.n==1)d*=partsLeft(b)>5?.35:1;p.hp-=d;p.fl=3;
  if(p.hp<=0&&!p.dead){p.dead=1;p.hp=0;boom(p.wx,p.wy,2);sfx('big');G.shake=10;coins(p.wx,p.wy,20);addScore(5000,p.wx,p.wy);
    if(p.core){b.die=1;}else{pop(W/2,90,'부위 파괴!','#ffd060',16);}}}
function updBoss(b){b.t++;const fr=G.dm.fr;
  b.parts.forEach(p=>{if(p.fl)p.fl--;});
  if(b.die){b.die++;if(b.die%6==0){boom(b.x+rnd(-90,60),b.y+rnd(-70,70),1.6);sfx('boom');}G.shake=6;
    if(b.die==20){for(const e of G.eb)coins(e.x,e.y,1);G.eb=[];}
    if(b.die>150){boom(b.x,b.y,4);sfx('big');G.flash=20;coins(b.x,b.y,80);const bonus=50000*(G.stage+1);G.score+=bonus;pop(W/2,150,'격파 보너스 +'+bonus.toLocaleString(),'#ffe070',18);G.boss=null;G.phase='clear';G.pt0=G.t;}
    return;}
  if(b.entry>0){b.entry--;}
  else if(!G.cut&&!G.bombFx){const lv=bossHp(b)/b.max<.34?3:bossHp(b)/b.max<.67?2:1;if((b.qz||0)<lv){b.qz=(b.qz||0)+1;bossQuiz(b);return;}}
  const hpf=bossHp(b)/b.max;
  if(b.n==0){
    b.x+=(b.tx-b.x)*.03;b.y=170+Math.sin(b.t*.02)*40;const left=partsLeft(b);b.ph=left?1:hpf>.22?2:3;
    b.parts.forEach(p=>{if(p.k=='clubA'){p.ox=-36+Math.sin(b.t*.05)*8;p.oy=-72+Math.cos(b.t*.04)*6;}if(p.k=='clubB'){p.ox=-36+Math.cos(b.t*.05)*8;p.oy=74+Math.sin(b.t*.04)*6;}p.wx=b.x+p.ox;p.wy=b.y+p.oy;});
    if(b.entry>0)return;b.ft--;
    if(b.ph==1&&b.ft<=0){const cs=b.parts.filter(p=>!p.core&&!p.dead);const c=cs[b.t%2?0:cs.length-1];if(c){fan(c.wx-60,c.wy,5,3.2,.14,'f');}if(b.t%3==0)fan(b.x-30,b.y+20,7,2.4,.2,'r');b.ft=48*fr;}
    if(b.ph==2){if(b.t%5==0)eb(b.x-20,b.y+22,b.t*.13,2.6,'f');if(b.t%5==2)eb(b.x-20,b.y+22,-b.t*.13+PI,2.6,'b');if(b.t%70==0)fan(b.x-20,b.y,9,3,.12,'r');}
    if(b.ph==3){if(b.t%4==0)eb(b.x-20,b.y+22,b.t*.21,3,'f');if(b.t%40==0)ring(b.x,b.y,22,2.4,'b',b.t);if(b.t%180==0)b.tx=200;if(b.t%180==60)b.tx=500;}
  }
  if(b.n==1){
    const sp2=b.ph==1?.018:.026;b.ph=hpf>.5?1:2;
    const tx=W*.55+Math.sin(b.t*sp2)*200,ty=180+Math.sin(b.t*sp2*2.1)*120;
    if(b.entry>0){b.x+=(W-120-b.x)*.04;b.y+=(170-b.y)*.04;}else{b.x+=(tx-b.x)*.06;b.y+=(ty-b.y)*.06;}
    b.hist.unshift({x:b.x,y:b.y});if(b.hist.length>260)b.hist.pop();
    const core=b.parts[0];core.wx=b.x;core.wy=b.y;let k=0;
    b.parts.forEach((p,i)=>{if(!i)return;const h=b.hist[Math.min(b.hist.length-1,i*14)];p.wx=h.x;p.wy=h.y;});
    if(b.entry>0)return;b.ft--;
    if(b.ft<=0){const segs=b.parts.filter(p=>p.k=='seg'&&!p.dead);for(let i=0;i<(b.ph==1?2:4);i++){const s=pick(segs);if(s)eb(s.wx,s.wy,aimA(s.wx,s.wy),2.6,'b');}fan(b.x,b.y,b.ph==1?3:5,3,.25,'f');b.ft=50*fr;}
    if(b.ph==2&&b.t%90==0)ring(b.x,b.y,18,2.2,'r',b.t);
  }
  if(b.n==2){
    b.x+=(b.tx-b.x)*.02;b.y=150+Math.sin(b.t*.015)*22;const tl=b.parts.filter(p=>p.k=='tur'&&!p.dead).length,drg=b.parts[3];b.ph=tl?1:!drg.dead?2:3;
    b.parts.forEach(p=>{p.wx=b.x+p.ox;p.wy=b.y+p.oy;});
    if(b.entry>0)return;b.ft--;
    if(b.ph==1&&b.ft<=0){b.parts.forEach(p=>{if(p.k=='tur'&&!p.dead)fan(p.wx-14,p.wy,3,3,.2,'f');});for(let i=0;i<5;i++)eb(b.x-140+i*45,b.y+44,PI*.75,2.4,'r');b.ft=60*fr;}
    if(b.ph==2){if(b.t%3==0){const a=PI+Math.sin(b.t*.03)*.7;eb(drg.wx-40,drg.wy+10,a+rnd(-.05,.05),3.6,'f');}if(b.t%80==0)ring(b.x,b.y,16,2.2,'b',b.t);}
    if(b.ph==3){if(b.t%5==0)eb(b.x+120,b.y-10,b.t*.17,2.6,'r');if(b.t%5==2)eb(b.x+120,b.y-10,-b.t*.17,2.6,'b');if(b.t%45==0)fan(b.x,b.y+40,7,3,.14,'f');b.tx=440+Math.sin(b.t*.01)*40;}
  }
}

/* ================= 복습 퀴즈 진행 ================= */
const QTOP=112,LAMP_Y=[146,214,282],LOCK_T=45;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function laneBox(n){const top=QTOP+4,bot=G.stage<2?306:342;return {top,h:(bot-top)/n};}
// 정답 등불이 떠 있는 동안에는 유도탄도 곧게 날아가 줄(행)로만 답을 고른다.
const lampLive=()=>!!(G.quiz&&G.quiz.mode=='lamp'&&!G.quiz.done&&G.quiz.t>=45);
function startLampQuiz(){G.quiz={mode:'lamp',t:0,qq:qzNext(3,fitW(12,104)),done:0};}
function startGateQuiz(){const n=R()<.5?2:3;G.quiz={mode:'gate',t:0,n,qq:qzNext(n,fitW(13,150)),gx:W+80,done:0};}
function updQuiz(){const z=G.quiz;if(!z)return;z.t++;
  if(z.mode=='lamp'){
    if(z.t==45)z.qq.opts.forEach((o,i)=>sp('ans',W+30+i*16,LAMP_Y[i],{mv:'stop',tx:410+i*14,ty:LAMP_Y[i],st:70,stay:1e9,opt:i,label:o,ft:1e9}));
    // 같은 줄에서 쏜 탄이 계속 맞으면 조준 게이지가 차고, 다 차면 그 등불을 고른 것으로 본다.
    if(!z.done)for(const e of G.en)if(e.type=='ans'){const aim=Math.abs(G.p.y-e.y)<26&&G.t-(e.hitT??-99)<12;
      e.prog=aim?(e.prog||0)+1:Math.max(0,(e.prog||0)-3);if(e.prog>=LOCK_T){quizResolve(e.opt);break;}}
    if(!z.done&&z.t>45+720)quizResolve(-1);
  }
  if(z.mode=='gate'){
    if(z.t>70)z.gx-=1.55;
    if(!z.done&&z.gx<=G.p.x){const {top,h}=laneBox(z.n);quizResolve(cl(Math.floor((G.p.y-top)/h),0,z.n-1));}
  }
  if(z.done){z.dt++;if(z.dt>170&&(z.mode!='gate'||z.gx<-70))G.quiz=null;}
}
function quizResolve(choice){const z=G.quiz;if(!z||z.done)return;z.done=1;z.dt=0;z.choice=choice;const ok=qzRecord(z.qq,choice,z.mode);z.ok=ok;const p=G.p;
  let cx=p.x+40,cy=p.y;
  for(const e of G.en)if(e.type=='ans'){e.dead=1;
    if(e.opt===z.qq.ans){boom(e.x,e.y,1.2,'#fff27a');cx=e.x;cy=e.y;}else hitSpark(e.x,e.y);
    if(!ok&&e.opt===choice)ring(e.x,e.y,8,1.8,'r',R()*TAU);}
  if(ok){sfx('right');quizReward(cx,cy);pop(W/2,QTOP+24,'정답!','#9dffb0',22);}
  else{sfx('wrong');G.mult=1;pop(W/2,QTOP+24,choice<0?'시간 초과!':'아쉬워요!','#ff9a8a',20);}
}
function quizReward(x,y){const p=G.p;coins(x,y,14);G.mult=Math.min(10,G.mult+.5);G.maxMult=Math.max(G.maxMult,G.mult);addScore(3000,x,y-14);
  if(p.pow<4){p.pow++;pop(p.x,p.y-22,'영력 상승!','#8affff');}
  else if(p.bombs<5){p.bombs++;pop(p.x,p.y-22,BOMB_NAME+' +1','#ff9a8a');}
  else if(p.hp<p.max){p.hp++;pop(p.x,p.y-22,'기력 회복','#ff8aa8');}}
// 멈춤 퀴즈 패널(보스전·오답 다시 풀기 공용)
function quizPanel(qq,title,onAnswer,opt={}){
  const col=SUBJ_COLOR[qq.s]||'#fff';
  showOv(`<div class="pan quiz"><span class="qtag" style="--c:${col}">${qq.s}${qq.g?' · '+qq.g+'학년':''}</span><h3 class="qh">${esc(title)}</h3>
  <p class="qq">${esc(qq.q)}</p><div class="qopts">${qq.opts.map((o,i)=>`<button class="mb qo" data-i="${i}" data-keys="Digit${i+1} Numpad${i+1}"><span class="qn">${i+1}</span>${esc(o)}</button>`).join('')}</div>
  <p class="qfb" id="qfb"></p><div class="row" id="qnext" hidden><button class="mb" id="qc">${opt.next||'계속'}${kb('Enter')}</button></div></div>`);
  const bs=[...ov.querySelectorAll('.qo')];let done=false;
  bs.forEach(el=>el.onclick=()=>{if(done)return;done=true;const i=+el.dataset.i,ok=i===qq.ans;
    bs.forEach((b,j)=>{b.disabled=true;b.removeAttribute('data-keys');if(j===qq.ans)b.classList.add('right');else if(j===i)b.classList.add('wrong');});
    document.getElementById('qfb').innerHTML=(ok?'<b class="ok">정답!</b> ':'<b class="ng">아쉬워요.</b> 정답은 「'+esc(qq.a)+'」')+(qq.e?'<br><small>'+esc(qq.e)+'</small>':'');
    sfx(ok?'right':'wrong');onAnswer(i,ok);
    const qc=document.getElementById('qc');qc.dataset.keys=K_OK;document.getElementById('qnext').hidden=false;qc.onclick=()=>opt.close?opt.close(ok):hideOv();qc.focus({preventScroll:true});
  });}
function bossQuiz(b){G.quizPause=true;IN.chg=false;bC.classList.remove('on');const qq=qzNext(4);
  quizPanel(qq,STG[G.stage].boss+'의 수수께끼',i=>{
    const ok=qzRecord(qq,i,'boss');
    if(ok){const t=b.parts.find(q=>!q.core&&!q.dead)||b.parts.find(q=>q.core&&!q.dead);
      if(t){const dmg=b.max*.07;t.hp=Math.max(.5,t.hp-dmg);t.fl=14;boom(t.wx,t.wy,2.2,'#fff27a');coins(t.wx,t.wy,16);if(t.hp<=.5)dmgPart(b,t,50);}
      addScore(5000,W/2,170);pop(W/2,150,'정답 일격!','#fff27a',24);G.flash=12;G.shake=12;}
    else pop(W/2,150,'아쉬워요…','#ff9a8a',18);
  },{close:()=>{hideOv();G.quizPause=false;G.p.inv=Math.max(G.p.inv,90);}});}
/* ================= 업데이트 ================= */
function update(){
  if(G.state!='play'||G.paused||G.quizPause)return;
  const p=G.p;
  if(G.cut){G.cut.t++;if(G.cut.t==56){startBombFx();}if(G.cut.t>70)G.cut=null;if(G.cut&&G.cut.t<56)return;}
  G.t++;G.scroll+=1.6;if(G.shake)G.shake--;if(G.flash)G.flash--;
  if(G.talk){G.talk.t++;if(G.talk.t>240)G.talk=null;}
  // 진행
  if(G.phase=='intro'&&G.t>150){G.phase='waves';G.q=[];}
  if(G.phase=='waves'){if(!G.quiz)G.wt++;const wi=Math.floor(G.wt/WGAP);if(wi>=G.waveI&&G.waveI<DECK[G.stage].length&&!G.quiz){WAVES[DECK[G.stage][G.waveI]]();G.waveI++;}
    for(let i=G.q.length-1;i>=0;i--)if(G.q[i].t<=G.t){G.q[i].f();G.q.splice(i,1);}
    if(G.wt>bossAt(G.stage)&&!G.quiz&&!G.en.some(e=>e.type!='ans')){G.phase='warn';G.pt0=G.t;sfx('warn');}}
  else if(G.q&&G.q.length){for(let i=G.q.length-1;i>=0;i--)if(G.q[i].t<=G.t){G.q[i].f();G.q.splice(i,1);}}
  if(G.phase=='warn'){if((G.t-G.pt0)%60==0)sfx('warn');if(G.t-G.pt0>170){G.phase='boss';G.boss=makeBoss(G.stage);}}
  if(G.phase=='clear'&&G.t-G.pt0>150){stageClear();return;}
  // 플레이어
  if(!p.dead){
    let mx=IN.dx,my=IN.dy;IN.dx=0;IN.dy=0;const sp2=CH[p.ch].spd*(p.charge>0?.55:1);
    let kx=(IN.k.ArrowRight||IN.k.KeyD?1:0)-(IN.k.ArrowLeft||IN.k.KeyA?1:0),ky=(IN.k.ArrowDown||IN.k.KeyS?1:0)-(IN.k.ArrowUp||IN.k.KeyW?1:0);
    if(kx&&ky){kx*=.7071;ky*=.7071;}mx+=kx*sp2;my+=ky*sp2;
    const ml=Math.hypot(mx,my),lim=sp2*2.6;if(ml>lim){mx*=lim/ml;my*=lim/ml;}
    p.x=cl(p.x+mx,18,W-24);p.y=cl(p.y+my,24,G.stage<2?300:H-18);p.frame++;
    p.trail.unshift({x:p.x,y:p.y});if(p.trail.length>40)p.trail.pop();
    if(p.inv)p.inv--;
    if(IN.chg||IN.k.KeyC){if(p.charge<60){p.charge++;if(p.charge==60)sfx('chg');}else p.charge=60;if(p.charge<2)p.charge=2;}else if(p.charge>0)releaseCharge();
    if(G.phase!='clear')playerFire();
  }
  // 샷
  for(const s of G.sh){s.t++;s.l--;
    if(s.k=='beam'){s.x=p.x+20;s.y=p.y-2;continue;}
    if(s.home&&!lampLive()){let best=null,bd=1e9;for(const e of G.en){if(e.type=='ans')continue;const d=dist2(e.x,e.y,s.x,s.y);if(d<bd&&e.x>s.x-30){bd=d;best=e;}}if(G.boss)for(const q of G.boss.parts)if(!q.dead){const d=dist2(q.wx,q.wy,s.x,s.y);if(d<bd){bd=d;best={x:q.wx,y:q.wy};}}
      if(best&&s.t>(s.home==2?10:4)){const a=Math.atan2(best.y-s.y,best.x-s.x),sp3=Math.hypot(s.vx,s.vy)+.08,ca=Math.atan2(s.vy,s.vx);let da=a-ca;while(da>PI)da-=TAU;while(da<-PI)da+=TAU;const na=ca+cl(da,-.12,.12);s.vx=Math.cos(na)*Math.min(sp3,9);s.vy=Math.sin(na)*Math.min(sp3,9);}}
    if(s.wv)s.vy=Math.cos(s.t*.22+s.ph)*s.wv;
    if(s.k=='vort')for(const b of G.eb)if(!b.dead&&dist2(b.x,b.y,s.x,s.y)<32*32){b.dead=1;if(R()<.5)coins(b.x,b.y,1);}
    s.x+=s.vx;s.y+=s.vy;if(s.x>W+40||s.x<-40||s.y<-40||s.y>H+40)s.l=0;}
  // 적
  for(const e of G.en)if(!e.dead)updEnemy(e);
  if(G.boss)updBoss(G.boss);
  updQuiz();
  // 충돌: 샷 vs 적
  for(const s of G.sh){if(s.l<=0)continue;
    if(s.k=='beam'){for(const e of G.en)if(!e.dead&&e.x>s.x&&Math.abs(e.y-s.y)<e.r+9)dmgEnemy(e,s.dmg);if(G.boss)for(const q of G.boss.parts)if(!q.dead&&q.wx>s.x&&Math.abs(q.wy-s.y)<q.r+9)dmgPart(G.boss,q,s.dmg);continue;}

function drawBeast(b,lt,art,f,p){

}

  <p class="keys">조작: 화면을 끌어서 이동 · 공격은 자동 · 集 길게 눌렀다 떼면 모아쏘기 · 奧 사신오의(네 신수가 함께 몰아친다)<br>키보드: 방향키/WASD 이동 · C 모아쏘기 · X 사신오의 · P/Esc 일시정지 · M 소리 · F 전체화면 &nbsp;|&nbsp; 선택: ←→ 또는 1~4 수호자 · ↑↓ 난이도</p></div>`);
  ov.querySelectorAll('.card').forEach(el=>el.onclick=()=>selChar(+el.dataset.c));
  ov.querySelectorAll('[data-d]').forEach(el=>el.onclick=()=>selDif(+el.dataset.d));
  document.getElementById('back').onclick=toTitle;
  document.getElementById('go').onclick=()=>{auInit();studyScreen();};}
const STORY=['달이 가장 밝은 밤, 흑철 요괴군의 하늘배가 구름을 찢고 내려왔다.','그들의 목표는 달 — 달빛을 삼켜 세상을 영원한 밤에 가두려 한다.','요괴들은 지혜의 빛에 약하다. 정답을 맞힐 때마다 사신의 힘이 깨어난다!','정답 등불을 쏘고, 정답 관문으로 날고, 보스의 수수께끼를 풀어라. 마지막 비행이 시작된다.'];
function introScreen(){let i=0;const show=()=>{showOv(`<div class="pan"><h2>${i==0?'서막':''}</h2><p style="font-size:clamp(15px,2.8vw,19px);min-height:3em">${STORY[i]}</p><div class="row"><button class="mb alt" id="sk" data-keys="Escape KeyS">건너뛰기${kb('Esc')}</button><button class="mb" id="nx" data-keys="${K_OK}">${i<STORY.length-1?'다음':'출격!'}${kb('Enter')}</button></div></div>`);
  document.getElementById('nx').onclick=()=>{i++;if(i>=STORY.length)newRun();else show();};document.getElementById('sk').onclick=()=>newRun();};show();}
function stageClear(){const p=G.p;if(G.stage>=2){ending();return;}G.state='clear';BG.on=false;showUI();if(p.hp<p.max)p.hp++;saveHi();
  showOv(`<div class="pan"><h2>제${G.stage+1}막 돌파!</h2><p>점수 <b style="color:#f5c542">${G.score.toLocaleString()}</b> · 모은 엽전 ${G.stCoins.toLocaleString()}닢 · 처치 ${G.kills}</p><p>기력이 1 회복되었습니다.</p>${resultHtml(x=>x.stage===G.stage)}<div class="row"><button class="mb" id="nx" data-keys="${K_OK}">제${G.stage+2}막 「${STG[G.stage+1].name}」로${kb('Enter')}</button></div></div>`);
  document.getElementById('nx').onclick=()=>{auInit();startStage(G.stage+1);};}
function ending(){G.state='clear';BG.on=false;showUI();saveHi();endingPanel();}
function endingPanel(){
  showOv(`<div class="pan"><h2>달빛을 되찾다</h2><p>흑룡함이 운해 아래로 가라앉고, 밤하늘에 다시 둥근 달이 떠올랐다.</p><p>${CH[G.ch].full}의 이름이 사신의 전설에 새겨졌다.</p><p>최종 점수 <b style="color:#f5c542">${G.score.toLocaleString()}</b>${G.cont?` · 이어하기 ${G.cont}회`:''} · 최대 엽전 배율 ×${G.maxMult.toFixed(1)}</p>${resultHtml()}${reviewNote()}<div class="row"><button class="mb" id="t" data-keys="${K_OK} Escape">처음으로${kb('Enter')}</button></div></div>`);
  document.getElementById('t').onclick=goHome;}
function gameOver(){if(G.state!='play')return;G.state='over';BG.on=false;showUI();saveHi();overPanel();}
function overPanel(){
  showOv(`<div class="pan"><h2>격추당했다…</h2><p>점수 ${G.score.toLocaleString()} · 제${G.stage+1}막 「${STG[G.stage].name}」</p>${resultHtml()}${reviewNote()}<div class="row"><button class="mb" id="c" data-keys="${K_OK}">이어하기 (점수 초기화)${kb('Enter')}</button><button class="mb alt" id="t" data-keys="Escape KeyT">처음으로${kb('Esc')}</button></div></div>`);
  document.getElementById('c').onclick=()=>{auInit();const p=G.p;G.cont++;G.score=0;p.hp=p.max;p.dead=0;p.bombs=3;p.inv=180;G.quizPause=false;G.state='play';BG.on=true;showUI();hideOv();};
  document.getElementById('t').onclick=goHome;}
function saveHi(){if(G.score>G.hi)G.hi=G.score;try{localStorage.setItem('ssb_hi',G.hi);}catch(e){}}
function toTitle(){G.state='title';G.menuStage=0;BG.on=false;showUI();hideOv();}
function pauseGame(on){if(G.state!='play'||G.quizPause)return;G.paused=on;if(on){showOv(`<div class="pan"><h2>잠시 멈춤</h2><div class="row"><button class="mb" id="r" data-keys="${K_OK}">계속${kb('Enter')}</button><button class="mb alt" id="t" data-keys="KeyT">처음으로${kb('T')}</button></div></div>`);document.getElementById('r').onclick=()=>pauseGame(false);document.getElementById('t').onclick=()=>{G.paused=false;saveHi();toTitle();};}else hideOv();}

/* ================= 입력 ================= */
let scale=1,RS=1;const drag={id:null,x:0,y:0};
const landscape=document.getElementById('landscape');
function fit(){const vw=landscape.clientWidth,vh=landscape.clientHeight;scale=Math.min(vw/W,vh/H);const w=Math.floor(W*scale),h=Math.floor(H*scale),l=Math.floor((vw-w)/2),t=Math.floor((vh-h)/2);
  // 캔버스 내부 해상도를 실제 화면 픽셀에 맞춘다(논리 좌표 640×360은 그대로).
  const dpr=window.devicePixelRatio||1,k=cl(w*dpr/W,1,2560/W),cw=Math.round(W*k),chh=Math.round(H*k);
  if(cv.width!==cw||cv.height!==chh){cv.width=cw;cv.height=chh;}RS=cw/W;
  landscape.style.setProperty('--frame-height',h+'px');
  for(const el of[cv,stEl,titleScreen]){el.style.width=w+'px';el.style.height=h+'px';el.style.left=l+'px';el.style.top=t+'px';}
  ov.style.inset='0';const bs=Math.max(58,Math.min(96,h*.2));
  bB.style.width=bB.style.height=bs+'px';bC.style.width=bC.style.height=bs*.92+'px';bB.style.right=(w*.02)+'px';bB.style.bottom=(h*.04)+'px';bC.style.right=(w*.02+bs*1.08)+'px';bC.style.bottom=(h*.03)+'px';
  const sb=Math.max(34,w*.05);bB.style.fontSize=bC.style.fontSize=(bs*.2)+'px';bP.style.left=(w*.015)+'px';bM.style.left=(w*.015+sb+8)+'px';bF.style.left=(w*.015+(sb+8)*2)+'px';bP.style.width=bM.style.width=bF.style.width=sb+'px';}
window.addEventListener('resize',fit);
if(typeof ResizeObserver==='function')new ResizeObserver(fit).observe(landscape);
fit();
cv.addEventListener('pointerdown',e=>{e.preventDefault();auInit();
  if(G.state=='play'&&!G.paused){drag.id=e.pointerId;drag.x=e.clientX;drag.y=e.clientY;try{cv.setPointerCapture(e.pointerId);}catch(_){} }});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==drag.id)return;IN.dx+=(e.clientX-drag.x)/scale*1.25;IN.dy+=(e.clientY-drag.y)/scale*1.25;drag.x=e.clientX;drag.y=e.clientY;});
const endDrag=e=>{if(e.pointerId===drag.id)drag.id=null;};cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
function hold(el,down,up){el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();auInit();el.classList.add('on');try{el.setPointerCapture(e.pointerId);}catch(_){}down();});
  const u=e=>{el.classList.remove('on');up&&up();};el.addEventListener('pointerup',u);el.addEventListener('pointercancel',u);el.addEventListener('lostpointercapture',u);}
hold(bB,doBomb);hold(bC,()=>{IN.chg=true;},()=>{IN.chg=false;});
bP.addEventListener('click',()=>pauseGame(!G.paused));
function toggleMute(){auInit();AU.muted=!AU.muted;if(AU.m)AU.m.gain.value=AU.muted?0:.5;bMI.textContent=AU.muted?'×':'♪';try{localStorage.setItem('ssb_mute',AU.muted?'1':'0');}catch(e){}}
bM.addEventListener('click',toggleMute);
/* 전체화면 */
const DOC=document.documentElement,fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const fsReq=DOC.requestFullscreen||DOC.webkitRequestFullscreen,fsExit=document.exitFullscreen||document.webkitExitFullscreen;
function toggleFull(){try{
  if(fsEl()){fsExit.call(document);return;}
  const r=fsReq.call(DOC,{navigationUI:'hide'});
  const lock=()=>{try{const q=screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape');if(q&&q.catch)q.catch(()=>{});}catch(_){}};
  if(r&&r.then)r.then(lock).catch(()=>{});else lock();
}catch(_){}}
function updFull(){const on=!!fsEl();document.getElementById('bFullPath').setAttribute('d',on?'M9 4v5H4M15 4v5h5M20 15h-5v5M4 15h5v5':'M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5');bF.setAttribute('aria-label',(on?'전체화면 끝내기':'전체화면')+' (F)');setTimeout(fit,60);}
if(!fsReq)bF.style.display='none';
bF.addEventListener('click',()=>{auInit();toggleFull();});
document.addEventListener('fullscreenchange',updFull);document.addEventListener('webkitfullscreenchange',updFull);
/* 키보드: e.code(물리 키) 기준이라 한글 입력 상태에서도 동작한다. */
function flashBtn(el){el.classList.add('on');setTimeout(()=>el.classList.remove('on'),140);}
window.addEventListener('keydown',e=>{const c=e.code;IN.k[c]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(c)&&!(e.target instanceof HTMLButtonElement&&G.state!='play'))e.preventDefault();
  if(c==='KeyF'&&!e.repeat){toggleFull();return;}
  if(c==='KeyM'&&!e.repeat){toggleMute();flashBtn(bM);return;}
  if(G.state==='title'){if(e.target!==startGame&&(c==='Enter'||c==='NumpadEnter'||c==='KeyZ'||c==='Space')&&!e.repeat)openSelection();return;}
  // 열린 메뉴의 버튼(data-keys)
  if(ov.classList.contains('show')&&!e.repeat){const b=[...ov.querySelectorAll('[data-keys]')].find(el=>el.dataset.keys.split(' ').includes(c));
    if(b&&!(e.target===b&&(c==='Enter'||c==='Space'))){e.preventDefault();b.click();return;}}
  if(G.state==='select'){
    const d=c==='ArrowLeft'||c==='KeyA'?-1:c==='ArrowRight'||c==='KeyD'?1:0;if(d){selChar(G.ch+d);return;}
    const v=c==='ArrowUp'||c==='KeyW'?-1:c==='ArrowDown'||c==='KeyS'?1:0;if(v){selDif(G.dif+v);return;}
    const n=/^(?:Digit|Numpad)([1-9])$/.exec(c);if(n&&+n[1]<=CH.length)selChar(+n[1]-1);return;}
  if(G.state==='study'&&!e.repeat){
    if(c==='ArrowLeft'||c==='KeyA'){stepGrade(-1);return;}if(c==='ArrowRight'||c==='KeyD'){stepGrade(1);return;}
    const n=/^(?:Digit|Numpad)([1-5])$/.exec(c);if(n)toggleSubj(SUBJ[+n[1]-1]);return;}
  if(G.state!=='play'||e.repeat||G.quizPause)return;
  if(c==='KeyX'&&!G.paused){doBomb();flashBtn(bB);}
  if(c==='KeyC')bC.classList.add('on');
  if(c==='Escape'||c==='KeyP'){pauseGame(!G.paused);flashBtn(bP);}});
window.addEventListener('keyup',e=>{IN.k[e.code]=false;if(e.code==='KeyC'&&!IN.chg)bC.classList.remove('on');});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state=='play'&&!G.paused)pauseGame(true);});
window.addEventListener('blur',()=>{IN.k={};IN.chg=false;bC.classList.remove('on');});

/* ================= 루프 ================= */
let last=performance.now(),acc=0;
function frame(t){requestAnimationFrame(frame);let dt=t-last;last=t;if(dt>100)dt=100;acc+=dt;let n=0;
  while(acc>=16.667&&n<4){if(G.state=='play')update();else{G.menuT=(G.menuT||0)+1;G.menuScroll=(G.menuScroll||0)+.8;}acc-=16.667;n++;}
  if(n>=4)acc=0;try{render();}catch(e){console.error(e);}bgm();}
try{buildAssets();}catch(e){console.error(e);document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;top:0;color:#f88">초기화 오류: '+e.message+'</p>');}
startGame.disabled=true;
loadCombatArt().then(()=>{startGame.disabled=false;}).catch(()=>{startGame.textContent='전투 그림을 열 수 없습니다';});
showUI();requestAnimationFrame(frame);
if(document.fonts)document.fonts.ready.then(()=>{});
window.__G=G;window.__api={update,render,newRun,qzBuild,qzNext,studyScreen,bossQuiz,startLampQuiz,startGateQuiz,QZ,QS,startStage,doBomb,selectScreen,makeBoss,IN,A};
}
</script>
