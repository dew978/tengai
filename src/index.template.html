.stab{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;width:min(100%,420px);margin:8px auto;text-align:left}

.stab .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}

}

function ridgeArt(g,y,height,palette,seed){
  const rs=seedR(seed),points=[];
  for(let x=0;x<LWD;x+=12)points.push([x,Math.round(y-(.3+.7*rs())*height*(.4+.6*Math.abs(Math.sin(x/LWD*TAU*3))))]);
  points.push([LWD,points[0][1]]);
  P(g,[0,180,...points.flat(),LWD,180],palette[0]);
  for(let i=0;i<points.length-1;i++){
    const [x,a]=points[i], [xx,b]=points[i+1];
    if(a<b){
      const reach=16+rs()*height*.6;
      P(g,[x,a,xx,b,xx+10,b+reach,x+5,a+reach*.65],palette[1]);
      L(g,[x,a+1,x+5,a+4,xx,b+1],palette[2],.8);
      L(g,[x+4,a+6,x+7,a+14,x+13,a+20],palette[0],1);

}

function roofArt(g,x,y,w,h,shade,trim){

  P(g,[...eaves,x+w+1,y+h+3,x-1,y+h+3],'#131e2a');
  P(g,eaves,shade);
  for(let i=1;i<12;i++){
    const t=i/12;
    L(g,[x+w*(.23+t*.54),y+1,x+w*t,y+h-1],'#22333f',.65);

}

function hallArt(g,y,w,levels,light){

    for(let j=0;j<Math.floor(width/9);j++){

function bambooArt(g,top,bottom,w,lean,palette,seed){
  const rs=seedR(seed);
  P(g,[0,bottom,lean,top,lean+w,top,w,bottom],palette[0]);
  L(g,[lean+w*.32,top,w*.32,bottom],palette[1],Math.max(.7,w*.25));
  for(let y=bottom-7;y>top;y-=11+rs()*10){
    const x=lean*(bottom-y)/(bottom-top);
    Rc(g,x-1,y,w+2,1,palette[2]);
    if(rs()<.4)continue;
    const dir=rs()>.5?1:-1,tip=x+dir*(7+rs()*10);

      P(g,[bx,by,bx+dir*6,by+dy,bx+dir*11,by+dy*1.25,bx+dir*6,by],palette[j%2]);

function foundryArt(g,y,w,h,palette,light,seed){

function gearArt(g,y,r,palette){

  g.strokeStyle=palette[1];g.lineWidth=4;g.beginPath();g.arc(0,y,r-2,0,TAU);g.stroke();

function genStage(n){

    Rc(g,0,0,320,180,LG(g,0,0,0,180,[[0,p.sky[0]],[.57,p.sky[1]],[1,p.sky[2]]]));
    for(let i=0;i<90;i++){
      const x=rs()*320,y=rs()*116;
      Rc(g,x,y,1,1,i%9===0?p.glow:p.far[2]);
    }
    if(n===1){
      Rc(g,0,40,320,140,RG(g,112,153,0,130,[[0,'#b55a39'],[1,'#b55a3900']]));

    }
    const x=n===0?229:86,y=n===0?49:117,r=n===0?29:23;
    Rc(g,x-62,y-62,124,124,RG(g,x,y,r*.45,62,[[0,n===0?'#b3d4ff85':'#ffcd8780'],[1,'#efe1c000']]));
    E(g,x,y,r,r,n===0?'#e4e9e1':'#ffe8a6');
    for(let i=0;i<42;i++){
      const a=rs()*TAU,d=(r-4)*Math.sqrt(rs());
      E(g,x+Math.cos(a)*d,y+Math.sin(a)*d,1+rs()*5,.6+rs()*2,
        n===0?['#c4cfca','#aebfbd','#eff3e6'][i%3]:['#ffd794','#ffce86','#fff1bd'][i%3],-.15);
    }
  },true);
  add(.055,g=>{
    for(let i=0;i<7;i++){
      const w=63+rs()*68,y=30+i*13+rs()*12;
      wrapArt(g,i*73+rs()*20,()=>cloudArt(g,y,w,p.cloud,41+i*17+n));
    }
  });
  add(.13,g=>ridgeArt(g,n===2?156:159,n===1?63:82,p.far,75+n));
  add(.23,g=>{
    ridgeArt(g,176,n===2?47:51,p.near,127+n);
    if(n===0){
      for(const [x,y,w,levels] of [[36,153,54,2],[190,159,75,3],[332,150,47,2],[428,158,36,1]]){
        wrapArt(g,x,()=>hallArt(g,y,w,levels,p.glow));
      }
    }else if(n===1){
      for(let i=0;i<10;i++){
        const x=i*48+rs()*16,h=43+rs()*38,w=24+rs()*18;
        wrapArt(g,x,()=>foundryArt(g,166,w,h,p.near,p.glow,44+i));
      }
    }else{
      for(let i=0;i<4;i++)wrapArt(g,i*122,()=>hallArt(g,149+i%2*8,42+i%2*14,2,p.glow));
    }
  });
  add(.53,g=>{
    if(n===0){
      for(let i=0;i<13;i++){
        const x=i*37+rs()*15,top=28+rs()*93,lean=rs()*18-9;
        wrapArt(g,x,()=>bambooArt(g,top,166,2+i%3,lean,p.near,420+i));
      }
    }else if(n===1){
      for(const [x,y,r] of [[49,95,20],[176,119,29],[331,84,24],[452,114,17]]){
        wrapArt(g,x,()=>gearArt(g,y,r,p.stone));
      }
      for(const y of [132,145]){
        Rc(g,0,y,LWD,4,p.stone[0]);Rc(g,0,y,LWD,1,p.stone[2]);
        for(let x=0;x<LWD;x+=24){Rc(g,x,y-2,3,8,p.stone[1]);Rc(g,x+1,y+1,1,1,p.glow);}
      }
    }else{
      for(let i=0;i<7;i++){
        const y=153+rs()*12,w=88+rs()*30;
        wrapArt(g,i*69,()=>cloudArt(g,y,w,p.cloud,201+i*19));
      }
    }
  });
  add(1,g=>{
    if(n===2){
      for(let i=0;i<8;i++){
        const y=176+rs()*8;
        wrapArt(g,i*60,()=>cloudArt(g,y,82,p.cloud,313+i*13));
      }
      return;
    }
    groundArt(g,p,261+n);
    for(let i=0;i<6;i++){
      const y=153+rs()*6;
      wrapArt(g,i*80+14,()=>{
        Rc(g,-3,y+6,7,3,p.stone[0]);Rc(g,-1,y,2,7,p.stone[2]);
        P(g,[-6,y-6,0,y-10,6,y-6],p.stone[1]);
        Rc(g,-3,y-6,6,6,p.stone[0]);Rc(g,-2,y-5,4,4,p.glow);Rc(g,-1,y-4,1,2,'#fff7cc');
      });
    }
  });
  return layers;
}

function killEnemy(e){e.dead=1;G.kills++;boom(e.x,e.y,e.type=='junk'||e.type=='bt'?1.6:1);sfx('boom');coins(e.x,e.y,ET[e.type].co);addScore(ET[e.type].sc,e.x,e.y-10);
  if(e.drop)G.it.push({x:e.x,y:e.y,vx:-1,vy:-1.5,k:e.drop,t:0});else if(e.type=='bt'&&R()<.35)G.it.push({x:e.x,y:e.y,vx:-1,vy:-1.5,k:'P',t:0});}
function updEnemy(e){e.t++;if(e.fl)e.fl--;const fr=G.dm.fr;
  switch(e.mv){
    case'sine':e.x+=e.vx;e.y=e.y0+Math.sin(e.t*e.fq+e.ph)*e.amp;break;
    case'line':e.x+=e.vx;e.y+=e.vy;break;
    case'swoop':e.x+=e.vx;e.y+=e.vy;if(e.t==e.turn){const a=aimA(e.x,e.y);e.vx=Math.cos(a)*3.3-.8;e.vy=Math.sin(a)*3.3;}break;
    case'stop':if(e.t<e.st){e.x+=(e.tx-e.x)*.05;e.y+=(e.ty-e.y)*.05;}else if(e.t>e.st+e.stay){e.vx-=.06;e.x+=e.vx;e.y+=e.vy;}else{e.y+=Math.sin(e.t*.04)*.4;e.vx=0;e.vy=e.y<180?-.4:.4;}break;
    case'dive':e.x+=e.vx;if(e.t<50)e.y+=(G.p.y-e.y)*.04;break;
    case'ground':e.x-=1.6;break;
  }
  if(e.x>W+80||e.x<-80||e.y<-80||e.y>H+80){if(e.t>60)e.dead=1;return;}
  if(e.x>W-10)return;e.ft--;if(e.ft>0)return;
  switch(e.type){
    case'df':if(R()<.35)eb(e.x,e.y,aimA(e.x,e.y),2.6);e.ft=9999;break;
    case'bt':if(e.mv=='stop'&&e.t>e.st&&e.t<e.st+e.stay){fan(e.x-10,e.y,3,3,.22,'f');if(G.stage>0)fan(e.x-10,e.y,2,2.2,.6,'b');e.ft=55*fr;}else e.ft=10;break;
    case'ln':if(e.t>e.st&&e.t<e.st+e.stay){ring(e.x,e.y,G.stage>1?16:12,2.2,'b',e.t*.05);e.ft=70*fr;}else e.ft=10;break;
    case'can':eb(e.x,e.y-8,aimA(e.x,e.y-8),3,'f');e.ft=80*fr;break;
    case'ket':if(e.t>e.st){fan(e.x-8,e.y,2,3.2,.15,'f');e.ft=60*fr;}else e.ft=10;break;
    case'junk':if(e.t>e.st){for(let i=0;i<3;i++)eb(e.x-20,e.y-8+i*8,PI,3,'f');fan(e.x,e.y,5,2.4,.3,'r');e.ft=75*fr;}else e.ft=10;break;
    case'bat':if(R()<.4)eb(e.x,e.y,aimA(e.x,e.y),3,'r');e.ft=9999;break;
    case'sup':e.ft=9999;break;
    case'ice':if(e.t>e.st){fan(e.x-8,e.y,3,3.1,.2,'b');e.ft=68*fr;}else e.ft=10;break;
    case'oni':fan(e.x-12,e.y,2,3.6,.07,'r');e.ft=46*fr;break;
  }}

function makeBoss(n){const hp=G.dm.hp;let b;
  if(n==0)b={n,x:W+140,y:170,tx:500,ty:170,t:0,parts:[{k:'clubA',ox:-30,oy:-70,r:24,hp:620*hp},{k:'clubB',ox:-30,oy:72,r:24,hp:620*hp},{k:'core',ox:-4,oy:0,r:40,hp:2400*hp,core:1}]};
  if(n==1){b={n,x:W+80,y:170,t:0,hist:[],parts:[{k:'core',ox:0,oy:0,r:26,hp:2600*hp,core:1}]};for(let i=0;i<10;i++)b.parts.push({k:'seg',i,r:20,hp:170*hp,ox:0,oy:0});}
  if(n==2)b={n,x:W+200,y:150,tx:460,ty:150,t:0,parts:[{k:'tur',ox:-70,oy:-2,r:16,hp:520*hp},{k:'tur',ox:-5,oy:-2,r:16,hp:520*hp},{k:'tur',ox:60,oy:-2,r:16,hp:520*hp},{k:'drg',ox:-150,oy:22,r:30,hp:1500*hp},{k:'core',ox:110,oy:-8,r:28,hp:2400*hp,core:1}]};
  if(n==3)b={n,x:W+170,y:180,tx:470,t:0,parts:[{k:'tail',i:0,ox:104,oy:-86,r:26,hp:560*hp},{k:'tail',i:1,ox:146,oy:38,r:26,hp:560*hp},{k:'tail',i:2,ox:100,oy:96,r:26,hp:560*hp},{k:'core',ox:-30,oy:-22,r:32,hp:2800*hp,core:1}]};
  if(n==4)b={n,x:W+180,y:170,tx:480,t:0,punch:0,parts:[{k:'fist',i:0,ox:-86,oy:-80,r:26,hp:900*hp},{k:'fist',i:1,ox:-86,oy:84,r:26,hp:900*hp},{k:'core',ox:0,oy:-6,r:40,hp:3600*hp,core:1}]};
  b.parts.forEach(p=>{p.max=p.hp;p.fl=0;p.dead=0;p.wx=0;p.wy=0;});b.max=b.parts.reduce((s,p)=>s+p.max,0);b.entry=150;b.ft=60;b.ph=1;b.die=0;return b;}
function bossHp(b){return b.parts.reduce((s,p)=>s+Math.max(0,p.hp),0);}
function partsLeft(b){return b.parts.filter(p=>!p.core&&!p.dead).length;}
function dmgPart(b,p,d){if(b.entry>0||b.die)return;if(p.core&&partsLeft(b)>0&&b.n!=1)d*=.2;if(p.core&&b.n==1)d*=partsLeft(b)>5?.35:1;p.hp-=d;p.fl=3;
  if(p.hp<=0&&!p.dead){p.dead=1;p.hp=0;boom(p.wx,p.wy,2);sfx('big');G.shake=10;coins(p.wx,p.wy,20);addScore(5000,p.wx,p.wy);
    if(p.core){b.die=1;}else{pop(W/2,90,'부위 파괴!','#ffd060',16);}}}
function updBoss(b){b.t++;const fr=G.dm.fr;
  b.parts.forEach(p=>{if(p.fl)p.fl--;});
  if(b.die){b.die++;if(b.die%6==0){boom(b.x+rnd(-90,60),b.y+rnd(-70,70),1.6);sfx('boom');}G.shake=6;
    if(b.die==20){for(const e of G.eb)coins(e.x,e.y,1);G.eb=[];}
    if(b.die>150){boom(b.x,b.y,4);sfx('big');G.flash=20;coins(b.x,b.y,80);const bonus=50000*(G.stage+1);G.score+=bonus;pop(W/2,150,'격파 보너스 +'+bonus.toLocaleString(),'#ffe070',18);G.boss=null;G.phase='clear';G.pt0=G.t;}
    return;}
  if(b.entry>0){b.entry--;}
  else if(!G.cut&&!G.bombFx){const lv=bossHp(b)/b.max<.34?3:bossHp(b)/b.max<.67?2:1;if((b.qz||0)<lv){b.qz=(b.qz||0)+1;bossQuiz(b);return;}}
  const hpf=bossHp(b)/b.max;
  if(b.n==0){
    b.x+=(b.tx-b.x)*.03;b.y=170+Math.sin(b.t*.02)*40;const left=partsLeft(b);b.ph=left?1:hpf>.22?2:3;
    b.parts.forEach(p=>{if(p.k=='clubA'){p.ox=-36+Math.sin(b.t*.05)*8;p.oy=-72+Math.cos(b.t*.04)*6;}if(p.k=='clubB'){p.ox=-36+Math.cos(b.t*.05)*8;p.oy=74+Math.sin(b.t*.04)*6;}p.wx=b.x+p.ox;p.wy=b.y+p.oy;});
    if(b.entry>0)return;b.ft--;
    if(b.ph==1&&b.ft<=0){const cs=b.parts.filter(p=>!p.core&&!p.dead);const c=cs[b.t%2?0:cs.length-1];if(c){fan(c.wx-60,c.wy,5,3.2,.14,'f');}if(b.t%3==0)fan(b.x-30,b.y+20,7,2.4,.2,'r');b.ft=48*fr;}
    if(b.ph==2){if(b.t%5==0)eb(b.x-20,b.y+22,b.t*.13,2.6,'f');if(b.t%5==2)eb(b.x-20,b.y+22,-b.t*.13+PI,2.6,'b');if(b.t%70==0)fan(b.x-20,b.y,9,3,.12,'r');}
    if(b.ph==3){if(b.t%4==0)eb(b.x-20,b.y+22,b.t*.21,3,'f');if(b.t%40==0)ring(b.x,b.y,22,2.4,'b',b.t);if(b.t%180==0)b.tx=200;if(b.t%180==60)b.tx=500;}
  }
  if(b.n==1){
    const sp2=b.ph==1?.018:.026;b.ph=hpf>.5?1:2;
    const tx=W*.55+Math.sin(b.t*sp2)*200,ty=180+Math.sin(b.t*sp2*2.1)*120;
    if(b.entry>0){b.x+=(W-120-b.x)*.04;b.y+=(170-b.y)*.04;}else{b.x+=(tx-b.x)*.06;b.y+=(ty-b.y)*.06;}
    b.hist.unshift({x:b.x,y:b.y});if(b.hist.length>260)b.hist.pop();
    const core=b.parts[0];core.wx=b.x;core.wy=b.y;let k=0;
    b.parts.forEach((p,i)=>{if(!i)return;const h=b.hist[Math.min(b.hist.length-1,i*14)];p.wx=h.x;p.wy=h.y;});
    if(b.entry>0)return;b.ft--;
    if(b.ft<=0){const segs=b.parts.filter(p=>p.k=='seg'&&!p.dead);for(let i=0;i<(b.ph==1?2:4);i++){const s=pick(segs);if(s)eb(s.wx,s.wy,aimA(s.wx,s.wy),2.6,'b');}fan(b.x,b.y,b.ph==1?3:5,3,.25,'f');b.ft=50*fr;}
    if(b.ph==2&&b.t%90==0)ring(b.x,b.y,18,2.2,'r',b.t);
  }
  if(b.n==2){
    b.x+=(b.tx-b.x)*.02;b.y=150+Math.sin(b.t*.015)*22;const tl=b.parts.filter(p=>p.k=='tur'&&!p.dead).length,drg=b.parts[3];b.ph=tl?1:!drg.dead?2:3;
    b.parts.forEach(p=>{p.wx=b.x+p.ox;p.wy=b.y+p.oy;});
    if(b.entry>0)return;b.ft--;
    if(b.ph==1&&b.ft<=0){b.parts.forEach(p=>{if(p.k=='tur'&&!p.dead)fan(p.wx-14,p.wy,3,3,.2,'f');});for(let i=0;i<5;i++)eb(b.x-140+i*45,b.y+44,PI*.75,2.4,'r');b.ft=60*fr;}
    if(b.ph==2){if(b.t%3==0){const a=PI+Math.sin(b.t*.03)*.7;eb(drg.wx-40,drg.wy+10,a+rnd(-.05,.05),3.6,'f');}if(b.t%80==0)ring(b.x,b.y,16,2.2,'b',b.t);}
    if(b.ph==3){if(b.t%5==0)eb(b.x+120,b.y-10,b.t*.17,2.6,'r');if(b.t%5==2)eb(b.x+120,b.y-10,-b.t*.17,2.6,'b');if(b.t%45==0)fan(b.x,b.y+40,7,3,.14,'f');b.tx=440+Math.sin(b.t*.01)*40;}
  }
  // 4th boss, 설한 구미호: three tails shoot ice fans; then ice spirals; last form lunges across the screen.
  if(b.n==3){const tl=b.parts.filter(p=>p.k=='tail'&&!p.dead).length;b.ph=tl?1:hpf>.28?2:3;
    b.x+=(b.tx-b.x)*(b.ph==3?.05:.03);b.y=180+Math.sin(b.t*.018)*(b.ph==3?90:60);
    b.parts.forEach(p=>{const w=p.k=='tail'?Math.sin(b.t*.05+p.i*1.7)*8:0;p.wx=b.x+p.ox+w*.5;p.wy=b.y+p.oy+w;});
    if(b.entry>0)return;b.ft--;const mx=b.x-58,my=b.y-16;
    if(b.ph==1&&b.ft<=0){b.parts.forEach(p=>{if(p.k=='tail'&&!p.dead)fan(p.wx-10,p.wy,3,3,.22,'b');});if(b.t%3==0)ring(mx,my,12,2.3,'b',b.t*.1);b.ft=56*fr;}
    if(b.ph==2){if(b.t%4==0)eb(mx,my,b.t*.19,2.8,'b');if(b.t%60==0)fan(mx,my,7,3.2,.13,'f');}
    if(b.ph==3){if(b.t%3==0)eb(mx,my,b.t*.23,3,'b');if(b.t%3==1)eb(mx,my,-b.t*.23,3,'r');if(b.t%200==0)b.tx=190;if(b.t%200==70)b.tx=470;}
  }
  // 5th boss, 흑철요왕: two iron fists punch at the guardian; then moon rings; last form fires crescent waves.
  if(b.n==4){const fl=b.parts.filter(p=>p.k=='fist'&&!p.dead);b.ph=fl.length?1:hpf>.3?2:3;
    b.x+=(b.tx-b.x)*.03;b.y=170+Math.sin(b.t*.016)*(b.ph==3?70:36);
    b.punch++;const pu=b.parts.find(p=>p.k=='fist'&&!p.dead&&p.i==(Math.floor(b.t/150)%2))||fl[0];
    b.parts.forEach(p=>{if(p.k!='fist'){p.wx=b.x+p.ox;p.wy=b.y+p.oy;return;}
      const hx=b.x+p.ox+Math.sin(b.t*.04+p.i*2)*6,hy=b.y+p.oy+Math.cos(b.t*.05+p.i)*8;if(!p.wx){p.wx=hx;p.wy=hy;}
      if(p===pu&&b.entry<=0){const k=b.t%150;if(k==40){p.tx=G.p.x;p.ty=G.p.y;}
        if(k<40){p.wx+=((hx+30)-p.wx)*.1;p.wy+=(hy-p.wy)*.1;}else if(k<70){p.wx+=((p.tx??hx)-p.wx)*.16;p.wy+=((p.ty??hy)-p.wy)*.16;}else{p.wx+=(hx-p.wx)*.06;p.wy+=(hy-p.wy)*.06;}
        if(k==70){G.shake=6;ring(p.wx,p.wy,10,2.2,'r',b.t);}}
      else{p.wx+=(hx-p.wx)*.1;p.wy+=(hy-p.wy)*.1;}});
    if(b.entry>0)return;b.ft--;const cx=b.x-10,cy=b.y-6;
    if(b.ph==1&&b.ft<=0){fl.forEach(p=>{if(p!==pu||b.t%150>80)fan(p.wx-14,p.wy,3,3,.18,'r');});fan(cx,cy,5,3.2,.16,'f');b.ft=62*fr;}
    if(b.ph==2){if(b.t%50==0)ring(cx,cy,20,2.3,'b',b.t*.07);if(b.t%4==0)eb(cx,cy,b.t*.15,2.7,'r');}

// 멈춤 퀴즈 패널(보스전·오답 다시 풀기 공용)
function quizPanel(qq,title,onAnswer,opt={}){
  const col=SUBJ_COLOR[qq.s]||'#fff';
  showOv(`<div class="pan quiz"><span class="qtag" style="--c:${col}">${qq.s}${qq.g?' · '+qq.g+'학년':''}</span><h3 class="qh">${esc(title)}</h3>
  <p class="qq">${esc(qq.q)}</p><div class="qopts">${qq.opts.map((o,i)=>`<button class="mb qo" data-i="${i}" data-keys="Digit${i+1} Numpad${i+1}"><span class="qn">${i+1}</span>${esc(o)}</button>`).join('')}</div>
  <p class="qfb qhint" id="qfb">답을 고른 뒤 확인을 눌러요.</p><div class="row"><button class="mb" id="qok" disabled>확인</button><button class="mb" id="qc" hidden>${opt.next||'계속'}</button></div></div>`);
  const bs=[...ov.querySelectorAll('.qo')],qok=document.getElementById('qok'),qc=document.getElementById('qc');let done=false,pick=-1;
  bs.forEach(el=>el.onclick=()=>{if(done)return;pick=+el.dataset.i;bs.forEach(b=>b.classList.toggle('pick',b===el));qok.disabled=false;qok.dataset.keys=K_OK;});
  qok.onclick=()=>{if(done||pick<0)return;done=true;const i=pick,ok=i===qq.ans;qok.hidden=true;qok.removeAttribute('data-keys');
    bs.forEach((b,j)=>{b.disabled=true;b.removeAttribute('data-keys');if(j===qq.ans)b.classList.add('right');else if(j===i)b.classList.add('wrong');});

// 선택한 수호자의 탄이 과녁(요괴)으로 날아가는 모습. 무엇을 쏘는지 한눈에 보이게.
const PV={raf:0,ch:-1,t:0,shots:[],fx:[]};
function startPreview(){PV.ch=-1;if(!PV.raf)PV.raf=requestAnimationFrame(previewLoop);}
function previewLoop(){PV.raf=0;if(G.state!=='select')return;drawPreview();PV.raf=requestAnimationFrame(previewLoop);}
function drawPreview(){
  const cvs=ov.querySelector('.card.sel .pv');if(!cvs)return;
  const r=cvs.getBoundingClientRect();if(!r.width)return;
  const dpr=Math.min(2,window.devicePixelRatio||1),cw=Math.round(r.width*dpr),chh=Math.round(r.height*dpr);
  if(cvs.width!==cw||cvs.height!==chh){cvs.width=cw;cvs.height=chh;}
  const g=cvs.getContext('2d'),LH=48,k=chh/LH,LW=cw/k,ch=G.ch;
  if(PV.ch!==ch){PV.ch=ch;PV.t=0;PV.shots=[];PV.fx=[];}
  const t=++PV.t,px=18,py=LH/2+Math.sin(t*.05)*2,tx=LW-16,ty=LH/2+Math.sin(t*.04)*6;
  // 쏘기: 수호자마다 실제 게임과 같은 모양
  if(ch===0&&t%18===1)for(const a of [0])PV.shots.push({k:'cres',x:px+12,y:py-2,vx:Math.cos(a)*3.4,vy:Math.sin(a)*3.4});
  if(ch===1&&t%16===1)for(const o of [0])PV.shots.push({k:'tal',x:px+10,y:py+o,vx:3,vy:o*.04});
  if(ch===2&&t%9===1)PV.shots.push({k:'arr',x:px+14,y:py-1,vx:6,vy:0});
  if(ch===3&&t%14===1)for(const ph of [0])PV.shots.push({k:'wat',x:px+12,y:py,vx:2.8,vy:0,ph,t0:t});
  for(const q of PV.shots){
    if(q.home){const a=Math.atan2(ty-q.y,tx-q.x),sp=Math.hypot(q.vx,q.vy)+.05,ca=Math.atan2(q.vy,q.vx);let da=a-ca;while(da>PI)da-=TAU;while(da<-PI)da+=TAU;const na=ca+cl(da,-.1,.1);q.vx=Math.cos(na)*Math.min(sp,4);q.vy=Math.sin(na)*Math.min(sp,4);}
    if(q.k==='wat')q.vy=Math.cos((t-q.t0)*.25+q.ph)*1.2;
    q.x+=q.vx;q.y+=q.vy;
    if(q.x>tx-6&&Math.abs(q.y-ty)<14){q.dead=1;PV.fx.push({x:tx-6,y:q.y,l:10});}
    if(q.x>LW+20||q.y<-10||q.y>LH+10)q.dead=1;}
  PV.shots=PV.shots.filter(q=>!q.dead);PV.fx=PV.fx.filter(e=>--e.l>0);
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cw,chh);g.setTransform(k,0,0,k,0,0);
  // 과녁: 잠자리 요괴
  const en=fr('df',t),ew=(en.logicalWidth||28)*32/(A.df[0].logicalWidth||28),eh=ew*(en.logicalHeight||14)/(en.logicalWidth||28);g.globalAlpha=.9;g.drawImage(en,tx-ew/2,ty-eh/2,ew,eh);g.globalAlpha=1;
  // 수호자
  const pl=fr('hero'+ch,t),pw=(pl.logicalWidth||36)*.95,ph2=(pl.logicalHeight||28)*.95;g.drawImage(pl,px-pw/2,py-ph2/2,pw,ph2);
  const glow={cres:A.gB,tal:A.gR,arr:A.gG,wat:A.gT};
  g.globalCompositeOperation='lighter';for(const q of PV.shots){const gl=glow[q.k],s2=q.k==='cres'?20:14;g.drawImage(gl,q.x-s2/2,q.y-s2/2,s2,s2);}
  for(const e of PV.fx){g.globalAlpha=e.l/10;g.drawImage(A.gW,e.x-9,e.y-9,18,18);}g.globalAlpha=1;g.globalCompositeOperation='source-over';
  for(const q of PV.shots){g.save();g.translate(q.x,q.y);g.rotate(Math.atan2(q.vy,q.vx));
    if(q.k==='cres')g.drawImage(A.cres,-6,-7.5,12,15);
    if(q.k==='tal')g.drawImage(A.tal,-6,-4,12,8);

    if(q.k==='wat')g.drawImage(A.water,-8,-4.5,16,9);
    g.restore();}
}

  if(G.state==='story'){if(!e.repeat&&!(e.target instanceof HTMLButtonElement&&storyEl.contains(e.target))){if(['Enter','NumpadEnter','Space','KeyZ','ArrowRight'].includes(c)){e.preventDefault();G.storyNext&&G.storyNext();}else if(c==='Escape')G.storySkip&&G.storySkip();}return;}
  if(G.state==='title'){if(e.target!==startGame&&(c==='Enter'||c==='NumpadEnter'||c==='KeyZ'||c==='Space')&&!e.repeat)openSelection();return;}
  // 열린 메뉴의 버튼(data-keys)
  if(ov.classList.contains('show')&&!e.repeat){const b=[...ov.querySelectorAll('[data-keys]')].find(el=>el.dataset.keys.split(' ').includes(c));
    if(b&&!(e.target===b&&(c==='Enter'||c==='Space'))){e.preventDefault();b.click();return;}}
  if(G.state==='select'){
    const d=c==='ArrowLeft'||c==='KeyA'?-1:c==='ArrowRight'||c==='KeyD'?1:0;if(d){selChar(G.ch+d);return;}
    const v=c==='ArrowUp'||c==='KeyW'?-1:c==='ArrowDown'||c==='KeyS'?1:0;if(v){selDif(G.dif+v);return;}
    const n=/^(?:Digit|Numpad)([1-9])$/.exec(c);if(n&&+n[1]<=CH.length)selChar(+n[1]-1);return;}
  if(G.state==='study'&&!e.repeat){
    if(c==='ArrowLeft'||c==='KeyA'){stepGrade(-1);return;}if(c==='ArrowRight'||c==='KeyD'){stepGrade(1);return;}
    const n=/^(?:Digit|Numpad)([1-5])$/.exec(c);if(n)toggleSubj(SUBJ[+n[1]-1]);return;}
  if(G.state!=='play'||e.repeat||G.quizPause)return;
  if(c==='KeyX'&&!G.paused){doBomb();flashBtn(bB);}
  if(c==='KeyC')bC.classList.add('on');
  if(c==='Escape'||c==='KeyP'){pauseGame(!G.paused);flashBtn(bP);}});
window.addEventListener('keyup',e=>{IN.k[e.code]=false;if(e.code==='KeyC'&&!IN.chg)bC.classList.remove('on');});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state=='play'&&!G.paused)pauseGame(true);if(AU.c){if(document.hidden)AU.c.suspend();else AU.c.resume();}});
window.addEventListener('blur',()=>{IN.k={};IN.chg=false;bC.classList.remove('on');});

/* ================= 루프 ================= */
let last=performance.now(),acc=0;
// Steps the canvas resolution down while play keeps running below ~45 fps; the lowest steps also drop small effects.
const PF={avg:16.7,n:0,fps:0,show:/[?&]fps/.test(location.search)};
function perfWatch(dt){PF.avg+=(dt-PF.avg)*.05;PF.fps=1000/PF.avg;if(G.state!=='play'||G.paused||G.quizPause||document.hidden){PF.n=0;return;}
  if(PF.avg>22)PF.n++;else PF.n=Math.max(0,PF.n-2);
  if(PF.n>90){PF.n=0;const i=RS_STEPS.findIndex(v=>v<Math.min(RS_CAP,RS)-.01);if(i>=0){RS_CAP=RS_STEPS[i];if(RS_CAP<=1.5)LOWFX=true;fit();}else LOWFX=true;}}
function frame(t){requestAnimationFrame(frame);let dt=t-last;last=t;if(dt>100)dt=100;perfWatch(dt);acc+=dt;let n=0;
  while(acc>=16.667&&n<4){if(G.state=='play')update();else{G.menuT=(G.menuT||0)+1;G.menuScroll=(G.menuScroll||0)+.8;}acc-=16.667;n++;}
  if(n>=4)acc=0;try{render();}catch(e){console.error(e);}bgm();}
try{buildAssets();}catch(e){console.error(e);document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;top:0;color:#f88">초기화 오류: '+e.message+'</p>');}
startGame.disabled=true;
loadCombatArt().then(ill=>{startGame.disabled=false;buildAnims(ill);}).catch(()=>{startGame.textContent='전투 그림을 열 수 없습니다';});
showUI();requestAnimationFrame(frame);
if(document.fonts)document.fonts.ready.then(()=>{});
window.__G=G;window.__api={update,render,drawBG,drawAtmosphere,drawWorld,drawHUD,fit,PF,perfWatch,q:()=>({RS_CAP,LOWFX,RS}),drawPreview,newRun,qzBuild,qzNext,studyScreen,bossQuiz,popupQuiz,QZ,QS,startStage,doBomb,selectScreen,makeBoss,IN,A,AU,sfx,bgm,AN,fr,RIG,aniFrames};
}
